<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada | EndoAfetos</title>
<meta name="theme-color" content="#b3427a">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/logo.png">
<!-- Página de endereço não encontrado. Gravada por ferramenta: não edite à mão. -->
<style>
/* As cores e as fontes são as do estilo da página inicial, com os mesmos nomes. Os caminhos começam com "/"
   porque esta página responde por qualquer endereço que não existe, em qualquer pasta. */
:root {
  --cream: #f8f4f2;
  --rose: #b3427a;
  --rose-dark: #8c2f5f;
  --ink: #494f83;
  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; padding: 2.5rem 1.25rem;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--sans); font-size: 1.0625rem; line-height: 1.7; text-align: center;
  color: var(--ink); background: var(--cream); -webkit-font-smoothing: antialiased;
}
main { width: 100%; max-width: 32rem; }
p { margin: 0 0 1.75rem; }
p:last-child { margin-bottom: 0; }
.marca { margin-bottom: 2rem; font-family: var(--serif); font-size: 1.6rem; font-weight: 600; line-height: 1.2; }
.marca img { display: block; width: 92px; height: auto; margin: 0 auto .6rem; }
.marca em { font-style: normal; color: var(--rose); }
h1 { margin: 0 0 .5em; font-family: var(--serif); font-size: 2rem; font-weight: 500; line-height: 1.15; }
.botao {
  display: inline-block; padding: .85rem 1.7rem; border-radius: 999px;
  background: var(--rose); color: #fff; font-weight: 700; text-decoration: none;
}
.botao:hover { background: var(--rose-dark); }
:focus { outline: 3px solid var(--rose-dark); outline-offset: 3px; }
:focus:not(:focus-visible) { outline: none; }
</style>
</head>
<body>
<main>
  <p class="marca"><img src="/assets/logo.png" alt="" width="92" height="68">Endo<em>Afetos</em></p>
  <h1>Página não encontrada</h1>
  <p>Este endereço não existe no nosso site, ou a página mudou de lugar.</p>
  <p><a class="botao" href="/">Voltar ao início</a></p>
</main>
</body>
</html>
