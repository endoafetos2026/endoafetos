<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- remover quando o conteúdo for assinado -->
<meta name="robots" content="noindex">
<title>MarIA Flor — assistente virtual da EndoAfetos</title>
<meta name="theme-color" content="#b3427a">
<link rel="icon" type="image/png" href="../assets/logo.png">
<style>
/* Paleta e tipografia do site EndoAfetos, sem carregar fontes de fora */
:root {
  --cream: #f8f4f2;
  --cream-2: #efe8ec;
  --surface: #ffffff;
  --rose: #b3427a;
  --rose-dark: #8c2f5f;
  --rose-mist: #f9eef3;
  --gold-soft: #e7e0f6;
  --lavender: #8a62a3;
  --lavender-soft: #e4dbef;
  --ink: #494f83;
  --ink-soft: #6c6b88;
  --line: #e6dde3;
  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --radius: 20px;
  --radius-sm: 12px;
  --shadow: 0 18px 45px -22px rgba(73, 79, 131, 0.40);
  --shadow-sm: 0 8px 22px -14px rgba(73, 79, 131, 0.38);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--sans);
  font-size: 1.0625rem;
  line-height: 1.6;
  color: var(--ink);
  word-wrap: break-word;
  overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(1200px 600px at 50% -10%, var(--gold-soft) 0%, transparent 55%),
    linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
}
img { max-width: 100%; }
p { margin: 0 0 1em; }
/* O Safari anterior ao 15.4 não conhece :focus-visible: descarta a segunda regra e fica com o contorno da primeira */
:focus { outline: 3px solid var(--rose-dark); outline-offset: 3px; }
:focus:not(:focus-visible) { outline: none; }
main:focus, [tabindex="-1"]:focus { outline: none; }
button, a, label, input, textarea { touch-action: manipulation; }

.pular {
  position: absolute; left: 1rem; top: -5rem; z-index: 10;
  display: inline-flex; align-items: center; min-height: 44px;
  padding: .6rem 1rem;
  background: var(--surface); color: var(--rose-dark);
  font-weight: 700;
  border: 2px solid var(--rose-dark); border-radius: var(--radius-sm);
}
.pular:focus { top: 1rem; }

/* Espaço por margem, não por gap em flex: o Safari do iOS anterior ao 14.5 ignora o gap */
.topo { background: var(--cream); border-bottom: 1px solid var(--line); }
/* O topo só acompanha a rolagem onde a página sabe descontar a altura dele ao rolar até uma
   resposta (iOS 14.5 em diante). Nos mais antigos fica parado e nada é encoberto. */
@supports (scroll-margin-top: 1px) {
  html { scroll-padding-top: 6rem; }
  .topo { position: sticky; top: 0; z-index: 5; }
}
.topo__dentro { display: flex; align-items: center; max-width: 640px; margin: 0 auto; padding: .65rem 1rem; }
.topo__marca { margin: 0; line-height: 1.25; }
.topo__nome, .topo__sub { display: block; }
.topo__nome { font-family: var(--serif); font-size: 1.4rem; font-weight: 600; color: var(--ink); }
.topo__nome em { font-style: normal; color: var(--rose-dark); }
.topo__sub { font-size: .9rem; color: var(--ink); }

/* Avatar: a borboleta do logotipo. Cada estado muda o traço e o halo, não só a cor. */
.avatar {
  flex: none;
  width: 56px;
  height: 56px;
  margin-right: .85rem;
  padding: 7px;
  object-fit: contain;
  background: var(--surface);
  border: 3px solid var(--rose);
  border-radius: 50%;
  box-shadow: 0 0 0 4px var(--rose-mist);
  transition: border-color .3s ease, box-shadow .3s ease;
}
.avatar[data-estado="acolhimento"] { border-color: var(--rose); border-style: solid; box-shadow: 0 0 0 4px var(--rose-mist); }
.avatar[data-estado="escuta"] {
  border-color: var(--lavender);
  border-style: dashed;
  box-shadow: 0 0 0 5px var(--lavender-soft);
  animation: avatar-escuta 1.6s ease-in-out infinite;
}
.avatar[data-estado="informacao"] { border-color: var(--ink); border-style: dotted; box-shadow: 0 0 0 4px var(--gold-soft); }
.avatar[data-estado="orientacao"] { border-color: var(--rose-dark); border-style: double; border-width: 5px; box-shadow: 0 0 0 4px var(--cream-2); }
@keyframes avatar-escuta {
  0%, 100% { box-shadow: 0 0 0 2px var(--lavender-soft); }
  50% { box-shadow: 0 0 0 9px var(--lavender-soft); }
}

main { padding: 1rem 1rem 1.5rem; }
.cartao {
  max-width: 640px;
  margin: 0 auto;
  /* Valor de reserva antes de cada clamp(): o iOS anterior ao 13.4 descarta a declaração com clamp */
  padding: 1.15rem;
  padding: clamp(1.15rem, 5vw, 2.25rem);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.titulo {
  margin: 0 0 .6em;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 1.5rem;
  font-size: clamp(1.5rem, 6vw, 2.1rem);
  line-height: 1.2;
  color: var(--ink);
}
.subtitulo, .temas__nome, .cartao-convite__titulo {
  margin: 0 0 .5rem;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 1.25rem;
  line-height: 1.25;
  color: var(--ink);
}
.temas__nome { font-size: 1.1rem; font-weight: 600; color: var(--rose-dark); }

.aviso {
  margin: 1rem 0 1.25rem;
  padding: .85rem 1rem;
  border-left: 6px solid var(--rose);
  border-radius: var(--radius-sm);
  background: var(--rose-mist);
  font-weight: 600;
}
.dica { margin: .35rem 0 .75rem; font-size: .92rem; color: var(--ink-soft); }
.status { min-height: 1.6em; margin: .5rem 0; font-weight: 700; color: var(--rose-dark); }
.status:empty { min-height: 0; margin: 0; }

.campo { margin-bottom: 1.1rem; }
.campo label, .escrita__rotulo { display: block; margin-bottom: .35rem; font-weight: 700; }
.campo input, .campo textarea, .escrita__campo {
  display: block;
  width: 100%;
  min-height: 48px;
  padding: .7rem .9rem;
  font: inherit;
  /* 16 px ou mais: abaixo disso o iOS aproxima a tela ao focar o campo */
  font-size: 1.0625rem;
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--ink-soft);
  border-radius: var(--radius-sm);
}
.campo textarea, .escrita__campo { min-height: 6.5rem; resize: vertical; }
.contador { margin: .3rem 0 0; font-size: .88rem; color: var(--ink-soft); text-align: right; }

.caixa { display: flex; align-items: flex-start; min-height: 44px; padding: .55rem 0; cursor: pointer; }
.caixa input { flex: none; width: 24px; height: 24px; margin: .1rem .75rem 0 0; accent-color: var(--rose-dark); }
.grupo { margin: 0 0 .75rem; padding: 0; border: 0; min-width: 0; }
.grupo legend { padding: 0; margin-bottom: .25rem; font-weight: 700; }
.desafio { max-width: 100%; margin: .75rem 0; }
.desafio:empty { margin: 0; }

.btn {
  display: flex; align-items: center; justify-content: center;
  width: 100%;
  min-height: 48px;
  margin: 0 0 .65rem;
  padding: .8rem 1.5rem;
  font: inherit;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
  border: 2px solid transparent;
  border-radius: 999px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .2s ease, box-shadow .2s ease;
}
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.btn--contorno { color: var(--rose-dark); background: var(--surface); border-color: var(--rose-dark); box-shadow: none; }
.btn[aria-disabled="true"] { opacity: .65; cursor: default; transform: none; }

.btn-mini {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 44px; min-width: 44px;
  margin: 0 .5rem .35rem 0;
  padding: .4rem 1rem;
  font: inherit;
  font-size: .95rem;
  font-weight: 700;
  color: var(--rose-dark);
  background: var(--surface);
  border: 2px solid var(--rose-dark);
  border-radius: 999px;
  cursor: pointer;
}
.btn-mini[aria-pressed="true"] { color: #fff; background: var(--rose-dark); border-style: double; border-width: 4px; }

.intro { margin-bottom: 1rem; }
/* Regiões vivas (registro e espera) ficam sempre na página: vazias, só perdem a margem.
   Com display:none o leitor de tela não anuncia o primeiro texto que entra nelas. */
.registro { margin: 0 0 .5rem; }
.registro:empty { margin: 0; }
.msg {
  margin: 0 0 .85rem;
  padding: .8rem .95rem;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
}
.msg > :last-child { margin-bottom: 0; }
.msg__autor { margin: 0 0 .25rem; font-size: .8rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--rose-dark); }
.msg__texto, .msg__extra, .msg__apoio { white-space: pre-wrap; word-break: break-word; }
.msg__texto { margin-bottom: .6em; }
.msg--pessoa { margin-left: 1.5rem; background: var(--lavender-soft); border-color: var(--lavender); }
.msg--pessoa .msg__autor { color: var(--ink); }
.msg--assistente { margin-right: 1.5rem; border-color: var(--rose); }
/* Mensagem de segurança: destaque sóbrio, pelo traço e não só pela cor */
.msg--seguranca { margin-right: 0; background: var(--cream); border: 3px solid var(--ink); border-left-width: 10px; }
.msg--limite, .msg--recusa, .msg--falha { border-style: dashed; border-color: var(--ink-soft); }
.msg--aviso { background: var(--cream); border-style: dashed; border-color: var(--ink-soft); font-weight: 600; }
.msg__contexto { margin-bottom: .35em; font-size: .92rem; font-weight: 700; }
.msg__marca { margin: 0 0 .15rem; font-weight: 800; }
.msg__frase { margin-bottom: .35em; font-style: italic; }
.msg__frase::before { content: "\201C"; }
.msg__frase::after { content: "\201D"; }
.msg__rotulo, .opcao__rotulo { font-size: .78rem; font-weight: 800; letter-spacing: .06em; color: var(--rose-dark); }
.msg__rotulo { margin-bottom: .6em; }
.msg__subtitulo { margin: .75rem 0 .15rem; font-weight: 800; }
.msg__extra { margin-bottom: .4em; }
.msg__apoio { margin-top: .75rem; padding-top: .75rem; border-top: 2px solid var(--ink-soft); font-weight: 700; }
.msg__tecnico { margin: .5rem 0 0; font-family: Consolas, Menlo, monospace; font-size: .8rem; color: var(--ink-soft); }
.msg__acoes { display: flex; flex-wrap: wrap; margin-top: .65rem; }
.msg__acoes:empty { display: none; }

.espera { margin: 0 0 .85rem; font-weight: 700; color: var(--rose-dark); }
.espera:empty { margin: 0; }

.escrita, .reabrir { margin: 0 0 1.5rem; padding: 1rem 0 0; border-top: 1px solid var(--line); }
.escrita .dica, .reabrir .dica { margin-top: 0; font-size: 1rem; font-weight: 700; color: var(--ink); }
.encerrar { margin: 0 0 1.5rem; }
.encerrar__pergunta { margin-bottom: .6rem; font-weight: 700; }
.rascunho > :last-child { margin-bottom: 0; }

.temas { margin: 0 0 1.5rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.opcao {
  display: block;
  width: 100%;
  min-height: 56px;
  margin: 0 0 .7rem;
  padding: .8rem 1rem;
  font: inherit;
  text-align: left;
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--lavender);
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.opcao:hover { background: var(--lavender-soft); }
.opcao__texto, .opcao__rotulo { display: block; }
.opcao__rotulo { margin-top: .3rem; }

.marcacao { margin-top: .75rem; }
.marcacao:empty { display: none; }
.marcacao__ok { font-weight: 700; }

.cartao-convite {
  margin: 0 0 1rem;
  padding: 1rem 1.1rem;
  background: var(--gold-soft);
  border: 2px solid var(--lavender);
  border-radius: var(--radius-sm);
}
.cartao-convite__texto { font-weight: 600; }
/* Sobre o lilás claro do cartão, o cinza das dicas não chega ao contraste AA */
.cartao-convite .dica { color: var(--ink); }
.cartao-convite__canais { margin-top: .5rem; }
.cartao-convite__canais:empty { display: none; }

/* Pré-lançamento: blocos à parte do cartão de convite */
.pre-inscricao, .exemplo-diario {
  margin: 0 0 1.5rem;
  padding: 1rem 1.1rem;
  background: var(--cream);
  border: 2px solid var(--lavender);
  border-radius: var(--radius-sm);
}
.pre-inscricao > :last-child { margin-bottom: 0; }
.pre-inscricao__texto { font-weight: 600; }
.exemplo-diario__folha {
  padding: .85rem .95rem;
  background: var(--surface);
  border: 2px dashed var(--ink-soft);
  border-radius: var(--radius-sm);
}
.exemplo-diario__titulo {
  margin: 0 0 .6rem;
  font-family: var(--serif);
  font-size: 1.1rem;
  font-weight: 600;
  line-height: 1.25;
  color: var(--rose-dark);
}
.exemplo-diario__registro { margin: 0 0 .7rem; padding-top: .6rem; border-top: 1px solid var(--line); }
.exemplo-diario__registro:last-child { margin-bottom: 0; }
.exemplo-diario__data { margin: 0 0 .2rem; font-size: 1rem; font-weight: 800; }
.exemplo-diario__campos { margin: 0; }
/* Espaço entre os pares por margem, sem gap */
.exemplo-diario__par { display: inline-block; margin: 0 1.25rem .1rem 0; }
.exemplo-diario__par--largo { display: block; margin-right: 0; }
.exemplo-diario__par dt, .exemplo-diario__par dd { display: inline; margin: 0; }
.exemplo-diario__par dt { font-weight: 800; }
.exemplo-diario__par dt::after { content: ": "; }
.exemplo-diario__rodape { margin: .75rem 0 0; font-size: .92rem; font-weight: 800; }

.canais {
  margin: 0;
  padding: 1rem 1.1rem;
  background: var(--cream);
  border: 2px solid var(--lavender);
  border-radius: var(--radius-sm);
}
.canais__emergencia { margin: 0 0 .35rem; font-weight: 800; }
.canais ul { display: flex; flex-wrap: wrap; margin: 0; padding: 0; list-style: none; }
.canais li { margin: 0 1.5rem .25rem 0; }
.canal, .ligacao {
  display: inline-flex; align-items: center;
  min-height: 44px; min-width: 44px;
  font-weight: 800;
  color: var(--rose-dark);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.ligacao { display: flex; }

.rodape { padding: 0 1rem 2rem; text-align: center; font-size: .92rem; color: var(--ink); }
.rodape p { margin: 0; }

@media (min-width: 520px) {
  .btn { display: inline-flex; width: auto; min-width: 13rem; margin-right: .6rem; }
}
/* Tela baixa (teclado aberto ou aparelho deitado): o topo deixa de acompanhar a rolagem */
@media (max-height: 420px) {
  .topo { position: static; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .btn:hover { transform: none; }
}
</style>
</head>
<body>
<a class="pular" href="#principal">Pular para o conteúdo</a>

<header class="topo">
  <div class="topo__dentro">
    <img class="avatar" id="avatar" src="../assets/logo.png" alt="Borboleta do logotipo EndoAfetos, avatar da MarIA Flor" width="56" height="56" data-estado="acolhimento" onerror="this.hidden=true">
    <p class="topo__marca">
      <span class="topo__nome">MarIA <em>Flor</em></span>
      <span class="topo__sub">Assistente virtual da EndoAfetos</span>
    </p>
  </div>
</header>

<main id="principal" tabindex="-1">
  <div class="cartao">
    <div id="palco">
      <noscript><p>Esta página precisa de JavaScript ativado no navegador. Em emergência de saúde, ligue 192.</p></noscript>
    </div>
  </div>
</main>

<footer class="rodape">
  <p>EndoAfetos | Conhecer para cuidar.</p>
</footer>

<script>
// PUBLICACAO: para ligar a pagina ao Worker, preencha so dois valores de CONFIG, logo abaixo.
// CONFIG.api: endereco https do Worker, sem caminho. CONFIG.turnstile_sitekey: chave publica do widget do Turnstile.
// Com os dois preenchidos, nada mais precisa mudar. Com CONFIG.api vazio, a pagina fica em demonstracao e nada sai dela.
/* ==== DADOS:INICIO ==== */
const VERSAO_PAGINA = "provisorio-2026-11-19";

// api vazio = modo demonstracao sem servidor: nenhuma requisicao sai da pagina.
const CONFIG = {
  api: "https://endoafetos-api-teste.endoafetos.workers.dev",
  turnstile_sitekey: "0x4AAAAAAGI2ABZoxe7E4K2n",
  turnstile_script: "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit",
  // Precisa ser igual a versao de aceite configurada no Worker.
  versao_aceite: "provisorio-2026-11-19",
  link_site: "../#contato",
  // { rotulo, endereco }: so preencher com os canais da organizacao assinados pela equipe.
  canais_organizacao: [],
  // Blocos de pre-lancamento, desligados por padrao. A pre-inscricao so aparece com coleta true em /api/saude.
  pre_inscricao: false,
  exemplo_diario: false,
  guarda_toque_ms: 500,
  mensagem_max: 1000,
  comentario_max: 1000,
  historico_max_turnos: 6,
  historico_max_caracteres: 4000,
  corpo_chat_max_bytes: 16000,
  nome_max: 40,
  email_max: 254,
  convite_max: 64,
  // Validade maior que esta em expira_em e tratada como relogio errado e ignorada.
  sessao_validade_max_ms: 86400000,
  espera_resposta_ms: 15000,
  espera_chat_ms: 60000,
  espera_script_ms: 10000,
  espera_turnstile_ms: 30000,
  espera_teclado_ms: 300
};

// PROVISORIO: todos os textos abaixo aguardam aprovacao da equipe.
const TEXTOS = {
  provisorio: true,
  estado: "em_curadoria",
  versao: "provisorio-2026-11-19",

  botao_comecar: "Começar",
  abrindo: "Abrindo a conversa. Aguarde um instante.",
  falta_caixa: "Para começar, marque a caixa de concordância.",
  falha_abrir: "Não foi possível abrir a conversa agora. Tente de novo daqui a pouco.",
  sessao_encerrada: "Sua sessão terminou. Para continuar, concorde de novo.",
  rascunho_guardado: "A pergunta que você escreveu ficou guardada nesta página. Ela volta ao campo quando a conversa abrir de novo.",
  rascunho_apagar: "Apagar a pergunta guardada",
  rascunho_apagado: "Pergunta apagada.",
  pergunta_no_campo: "Sua pergunta voltou ao campo. Para mandar de novo, toque em Enviar.",
  sem_codigo: "Para escrever perguntas nesta fase de teste, é preciso um código de convite.",
  informar_codigo: "Informar código de convite",
  reabrir_dica: "O campo para escrever não abriu. Você pode tentar abrir de novo.",
  reabrir_botao: "Tentar abrir o campo de novo",
  demo_titulo: "A assistente ainda não está ligada",
  demo_aviso: "Esta página está em modo demonstração sem servidor. A MarIA Flor ainda não está ligada, e nada do que você fizer aqui é enviado.",
  canais_titulo: "Canais de ajuda",
  emergencia: "Em emergência de saúde, ligue 192.",

  tentar: "Tentar de novo",

  aviso_limite: "Nesta versão respondo {n} perguntas escritas",
  aviso_limite_um: "Nesta versão respondo 1 pergunta escrita",
  restantes: "Perguntas escritas restantes: {n}",
  escrita_rotulo: "Escreva sua pergunta",
  contador: "{n} de {max} caracteres",
  botao_enviar: "Enviar",

  mensagem_vazia: "Escreva uma pergunta antes de enviar.",
  mensagem_grande: "A pergunta passou de {max} caracteres. Encurte para enviar.",

// Uma passada so: o que entra no lugar de {chave} nao e lido de novo.
function preencher(modelo, valores) {
  return String(modelo).replace(/\{(\w+)\}/g, function (trecho, chave) {
    return Object.prototype.hasOwnProperty.call(valores, chave) ? String(valores[chave]) : trecho;
  });
}

// Dentro da guarda, o toque ainda pode ser o segundo de um toque duplo na tela anterior.
function dentroDaGuarda(agora, mudouEm, guarda) {
  const passou = agora - mudouEm;
  return passou >= 0 && passou < guarda;
}

function textoOuNulo(valor) {
  return typeof valor === "string" && valor.trim() !== "" ? valor : null;
}

function apiAtiva(config) {
  return /^https:\/\/./.test(String(config.api == null ? "" : config.api));
}

function enderecoApi(config, caminho) {
  return String(config.api).replace(/\/+$/, "") + caminho;
}

// Toda resposta da API vira { ok: true, dados } ou { ok: false, erro, mensagem }.
function lerRespostaApi(status, corpo) {
  const valido = Boolean(corpo) && typeof corpo === "object";
  if (valido && corpo.ok === true) return { ok: true, status: status, dados: corpo };
  return {
    ok: false,
    status: status,
    erro: valido && typeof corpo.erro === "string" ? corpo.erro : "falha",
    mensagem: valido ? textoOuNulo(corpo.mensagem) : null
  };
}

function lerSaude(dados) {
  if (!dados || MODOS.indexOf(dados.modo) === -1) return null;
  return { modo: dados.modo, texto_livre: dados.texto_livre === true, coleta: dados.coleta === true };
}

// Instante em que a sessao vence, pelo relogio deste aparelho. Devolve null quando expira_em
// nao serve (ausente, ja passado ou longe demais): ai so o 401 do Worker avisa do vencimento.
function vencimentoDaSessao(expiraEm, agoraMs, validadeMaxMs) {
  const fim = typeof expiraEm === "string" ? Date.parse(expiraEm) : NaN;
  const falta = fim - agoraMs;
  return isFinite(falta) && falta > 0 && falta <= validadeMaxMs ? fim : null;
}

function sessaoVenceu(venceEm, agoraMs) {
  return typeof venceEm === "number" && agoraMs >= venceEm;
}

function lerSessao(dados, agoraMs, validadeMaxMs) {
  if (!dados || !textoOuNulo(dados.token)) return null;
  if (dados.tipo !== "livre" && dados.tipo !== "teste") return null;
  const numero = function (valor) {
    return typeof valor === "number" && isFinite(valor) && valor >= 0 ? Math.floor(valor) : null;
  };
  return {
    token: dados.token,
    tipo: dados.tipo,
    limite: numero(dados.limite),
    restantes: numero(dados.restantes),
    vence_em: vencimentoDaSessao(dados.expira_em, agoraMs, validadeMaxMs)
  };
}

// No modo fechado so quem informa o codigo pede sessao: sem codigo, ficam os botoes de tema,
// que nao dependem dela. Nos outros modos, a sessao e pedida quando ha texto livre a abrir.
function precisaDeSessao(saude, codigo) {
  if (saude.modo === "fechado") return codigo !== "";
  return saude.texto_livre === true;
}

// No modo fechado, o Worker so entrega os itens em curadoria de /api/guiado a quem manda o token
// de uma sessao de teste. Sem sessao de teste, o pedido segue sem token.
function tokenDoGuiado(sessao) {
  return Boolean(sessao) && sessao.tipo === "teste" && textoOuNulo(sessao.token) ? sessao.token : null;
}

function limparCodigo(texto, maximo) {
  return String(texto == null ? "" : texto).trim().slice(0, maximo);
}

function montarSessao(dados) {
  const convite = limparCodigo(dados.convite, dados.convite_max);
  return {
    turnstile: String(dados.turnstile),
    aceite_versao: dados.aceite_versao,
    convite: convite === "" ? null : convite
  };
}

function lerGuiado(dados) {
  if (!dados || !Array.isArray(dados.temas)) return null;
  const temas = [];
  dados.temas.forEach(function (tema) {
    if (!tema || !textoOuNulo(tema.titulo) || !Array.isArray(tema.itens)) return;
    const itens = [];
    tema.itens.forEach(function (item) {
      if (!item || !textoOuNulo(item.enunciado) || !textoOuNulo(item.resposta)) return;
      itens.push({
        id: textoOuNulo(item.id),
        enunciado: item.enunciado,
        rotulo_classificacao: textoOuNulo(item.rotulo_classificacao),
        resposta: item.resposta,
        quando_procurar: textoOuNulo(item.quando_procurar),
        pergunta_para_consulta: textoOuNulo(item.pergunta_para_consulta)
      });
    });
    if (itens.length > 0) temas.push({ id: textoOuNulo(tema.id), titulo: tema.titulo, itens: itens });
  });
  const canais = [];
  (Array.isArray(dados.canais) ? dados.canais : []).forEach(function (canal) {
    if (!canal || typeof canal.numero !== "string" || telefoneDoCanal(canal.numero) === "") return;
    canais.push({ numero: canal.numero.trim(), nome: textoOuNulo(canal.nome) });
  });
  return { temas: temas, canais: canais };
}

function rotuloCanal(canal) {
  if (!canal.nome) return canal.numero;
  return canal.nome.indexOf(canal.numero) !== -1 ? canal.nome : canal.nome + " " + canal.numero;
}

// So algarismos (e o + inicial) entram na ligacao tel:.
function telefoneDoCanal(numero) {
  const texto = String(numero == null ? "" : numero).trim();
  if (!/^\+?[\d ()-]{3,20}$/.test(texto)) return "";
  return (texto.charAt(0) === "+" ? "+" : "") + texto.replace(/\D/g, "");
}

// Ligacoes de CONFIG: so https, mailto, tel ou caminho do proprio site.
function enderecoSeguro(endereco) {
  const texto = String(endereco == null ? "" : endereco).trim();
  if (/^(?:https:\/\/|mailto:|tel:)[^\s]+$/i.test(texto)) return texto;
  if (/^(?:\.\.?\/|#)[^\s]*$/.test(texto) || /^\/(?!\/)[^\s]*$/.test(texto)) return texto;
  return null;
}

// Devolve "vazia", "grande" ou null quando a mensagem pode seguir.
function validarMensagem(texto, maximo) {
  const mensagem = String(texto == null ? "" : texto).trim();
  if (mensagem === "") return "vazia";
  if (mensagem.length > maximo) return "grande";
  return null;
}

function tamanhoEmBytes(texto) {
  let total = 0;
  for (let i = 0; i < texto.length; i++) {
    const codigo = texto.charCodeAt(i);
    if (codigo < 0x80) total += 1;
    else if (codigo < 0x800) total += 2;
    else if (codigo >= 0xD800 && codigo <= 0xDBFF && i + 1 < texto.length) { total += 4; i += 1; }
    else total += 3;
  }
  return total;
}

// Mesma janela do Worker: os turnos mais recentes, ate o maximo de turnos e de caracteres,
// comecando por fala da pessoa. Assinatura so nas falas da assistente.
function prepararHistorico(turnos, maxTurnos, maxCaracteres) {
  const aceitos = [];
  let caracteres = 0;
  for (let i = turnos.length - 1; i >= 0 && aceitos.length < maxTurnos; i--) {
    const turno = turnos[i];
    if (caracteres + turno.texto.length > maxCaracteres) break;
    caracteres += turno.texto.length;
    aceitos.unshift({
      papel: turno.papel,
      texto: turno.texto,
      assinatura: turno.papel === "assistente" ? turno.assinatura : null
    });
  }
  while (aceitos.length > 0 && aceitos[0].papel === "assistente") aceitos.shift();
  return aceitos;
}

function montarCorpoChat(mensagem, turnos, limites) {
  let historico = prepararHistorico(turnos, limites.max_turnos, limites.max_caracteres);
  let corpo = { mensagem: mensagem, historico: historico };
  while (historico.length > 0 && tamanhoEmBytes(JSON.stringify(corpo)) > limites.max_bytes) {
    historico = historico.slice(1);
    while (historico.length > 0 && historico[0].papel === "assistente") historico = historico.slice(1);
    corpo = { mensagem: mensagem, historico: historico };
  }
  return corpo;
}

function estadoValido(estado) {
  return ESTADOS_DO_AVATAR.indexOf(estado) !== -1 ? estado : "acolhimento";
}

// Resposta do chat fora do contrato vira null, e a pagina mostra a mensagem fixa de falha.
function lerChat(dados) {
  if (!dados || TIPOS_DE_RESPOSTA.indexOf(dados.tipo) === -1 || !textoOuNulo(dados.texto)) return null;
  let idTurno = null;
  if (typeof dados.id_turno === "number" && isFinite(dados.id_turno)) idTurno = String(dados.id_turno);
  else idTurno = textoOuNulo(dados.id_turno);
  return {
    tipo: dados.tipo,
    texto: dados.texto,
    estado: estadoValido(dados.estado),
    base_ids: (Array.isArray(dados.base_ids) ? dados.base_ids : []).filter(function (id) {
      return typeof id === "string" && id !== "";
    }),
    assinatura: textoOuNulo(dados.assinatura),
    restantes: typeof dados.restantes === "number" && isFinite(dados.restantes) ? dados.restantes : null,
    convite: dados.convite === true,
    linha_apoio: textoOuNulo(dados.linha_apoio),
    id_turno: idTurno
  };
}

function sinalDeRisco(chat) {
  return chat.tipo === "seguranca" || Boolean(chat.linha_apoio);
}

// O cartao aparece com o sinal do Worker, que o manda quando as perguntas acabam: ja na ultima
// resposta permitida (restantes 0) ou na mensagem de limite. Nunca com risco em algum ponto da sessao.
function podeConvidar(chat, houveRisco) {
  const acabou = chat.tipo === "limite" || chat.restantes === 0;
  return chat.convite === true && acabou && !sinalDeRisco(chat) && houveRisco !== true;
}

// Reenvio da mesma pergunta depois de uma falha: a fala que ficou sem resposta nao segue duas vezes.
function semFalaRepetida(turnos, mensagem) {
  const ultimo = turnos.length > 0 ? turnos[turnos.length - 1] : null;
  return ultimo && ultimo.papel === "pessoa" && ultimo.texto === mensagem ? turnos.slice(0, -1) : turnos;
}

function avisoDeLimite(textos, n) {
  return n === 1 ? textos.aviso_limite_um : preencher(textos.aviso_limite, { n: n });
}

function textoFalado(texto) {
  return String(texto).replace(/MarIA/g, "Maria");
}

function vozPtBr(vozes) {
  const lista = Array.prototype.slice.call(vozes || []);
  for (let i = 0; i < lista.length; i++) {
    if (lista[i] && /^pt[-_]br$/i.test(String(lista[i].lang))) return lista[i];
  }
  return null;
}

function limparNome(texto, maximo) {
  const limpo = String(texto == null ? "" : texto)
    .replace(/[\u0000-\u001F\u007F-\u009F]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
  let saida = "";
  // Percorre por caractere inteiro, para nao cortar um emoji ao meio.
  for (const letra of limpo) {
    if (saida.length + letra.length > maximo) break;
    saida += letra;
  }
  return saida.trim();
}

function emailValido(texto, maximo) {
  const email = String(texto == null ? "" : texto).trim();
  return email.length > 0 && email.length <= (maximo || 254) && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

// Devolve a chave do erro em TEXTOS.contato.erros, ou null quando pode enviar.
function validarContato(campos, limites) {
  if (limparNome(campos.nome, limites.nome_max) === "") return "falta_nome";
  const email = String(campos.email == null ? "" : campos.email).trim();
  if (email === "") return "falta_email";
  if (!emailValido(email, limites.email_max)) return "email_invalido";
  if (campos.contato !== true) return "falta_contato";
  if (campos.maior_de_18 !== true) return "falta_maior";
  return null;
}

// So o que a pessoa digitou no formulario: nada da sessao nem da conversa entra aqui.
function montarContato(dados) {
  return {
    nome: limparNome(dados.nome, dados.nome_max),
    email: String(dados.email).trim(),
    origem: "assistente",
    plano_interesse: null,
    aceites: {
      contato: dados.contato === true,
      maior_de_18: dados.maior_de_18 === true,
      versao_textos: dados.versao_textos
    },
    turnstile: String(dados.turnstile)
  };
}

function planoValido(plano, planos) {
  return planos.some(function (opcao) { return opcao.valor === plano; });
}

// Devolve a chave do erro, ou null quando pode enviar. O nome e opcional.
function validarPreInscricao(campos, limites) {
  const email = String(campos.email == null ? "" : campos.email).trim();
  if (email === "") return "falta_email";
  if (!emailValido(email, limites.email_max)) return "email_invalido";
  if (!planoValido(campos.plano, limites.planos)) return "falta_plano";
  if (campos.aviso !== true) return "falta_aviso";
  if (campos.maior_de_18 !== true) return "falta_maior";
  return null;
}

// So o que a pessoa preencheu neste formulario: nada da sessao nem da conversa entra aqui.
// No contrato de /api/contatos, o aceite de ser avisada vai no campo "contato".
function montarPreInscricao(dados) {
  const nome = limparNome(dados.nome, dados.nome_max);
  return {
    nome: nome === "" ? null : nome,
    email: String(dados.email).trim(),
    origem: "pre_inscricao",
    plano_interesse: dados.plano,
    aceites: {
      contato: dados.aviso === true,
      maior_de_18: dados.maior_de_18 === true,
      versao_textos: dados.versao_textos
    },
    turnstile: String(dados.turnstile)
  };
}

function motivoValido(motivo, motivos) {
  return motivos.some(function (opcao) { return opcao.valor === motivo; });
}

function montarFeedback(dados) {

    id_turno: dados.id_turno,

    comentario: String(dados.comentario == null ? "" : dados.comentario).trim().slice(0, dados.comentario_max)
  };
}
