    controleDeLeitura = { caixa: caixa, entrada: opcao.entrada, parar: parar };
    atualizarOuvir();
    return caixa;
  }

  // Devolve o item, para quem precisa saber depois se a leitura em curso e dele. Com a opcao ligada, a mensagem
  // nova e lida na hora; com ela desligada, nada toca.
  function registrarOuvivel(acoes, texto) {
    const item = { acoes: acoes, texto: texto, botao: null };
    ouviveis.push(item);
    if (leituraLigada) falar(item);
    return item;
  }

  function calarAoSair() {
    pararFala();
    const motor = motorDeVoz();
    if (motor) {
      try { motor.cancel(); } catch (falha) { /* sem efeito */ }
    }
  }

  (function () {
    const motor = motorDeVoz();
    if (motor) {
      if (typeof motor.addEventListener === "function") motor.addEventListener("voiceschanged", atualizarOuvir);
      else motor.onvoiceschanged = atualizarOuvir;
    }
    if (typeof window.addEventListener === "function") window.addEventListener("pagehide", calarAoSair);
    if (typeof document.addEventListener === "function") {
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) calarAoSair();
      });
    }
  })();

  /* ---- Canais de ajuda ---- */

  // Como no quiz: icone escondido do leitor de tela, nome com o numero e a descricao. A ligacao le "SAMU 192
  // Emergencia medica". O numero vem do servidor; nome e descricao, da tabela CANAIS_DESCRITOS.
  function listaDeCanais(canais) {
    const lista = no("ul");
    canais.forEach(function (canal) {
      const descrito = canalDescrito(canal);
      const item = no("li");
      const ligacao = no("a", "canal");
      ligacao.href = "tel:" + telefoneDoCanal(canal.numero);
      if (descrito.icone) {
        const icone = no("span", "canal__icone canal__icone--" + descrito.icone);
        icone.setAttribute("aria-hidden", "true");
        ligacao.appendChild(icone);
      }
      const texto = no("span", "canal__texto");
      texto.appendChild(no("span", "canal__rotulo", rotuloCanal(descrito)));
      if (descrito.descricao) texto.appendChild(no("span", "canal__descricao", descrito.descricao));
      ligacao.appendChild(texto);
      item.appendChild(ligacao);
      lista.appendChild(item);
    });
    return lista;
  }

  // Sem lista (API fora do ar ou ainda carregando), fica so a frase de emergencia.
  function blocoCanais() {
    const secao = no("section", "canais");
    secao.setAttribute("aria-labelledby", "titulo-canais");
    const titulo = no("h2", "subtitulo", TEXTOS.canais_titulo);
    titulo.id = "titulo-canais";
    const corpo = no("div");
    secao.appendChild(titulo);
    secao.appendChild(corpo);
    function preencherCanais(canais) {
      esvaziar(corpo);
      corpo.appendChild(no("p", "canais__emergencia", TEXTOS.emergencia));
      if (canais.length > 0) corpo.appendChild(listaDeCanais(canais));
    }
    preencherCanais([]);
    return { secao: secao, preencher: preencherCanais };
  }

  /* ---- Telas de entrada ---- */

  // Antes do aceite, a unica chamada e esta: GET sem corpo, para saber o modo do servico.
  function telaCarregando(focar) {
    const titulo = tituloDaTela(TEXTOS.carregando_titulo);
    const status = linhaDeStatus("status-carga");
    status.textContent = TEXTOS.carregando;
    mostrar([titulo, status], titulo, focar);
    const serie = estado.serie;
    pedir("/api/saude").then(function (resposta) {
      if (serie !== estado.serie) return;
      estado.saude = resposta.ok ? lerSaude(resposta.dados) : null;
      if (estado.saude) telaAceite(null, focar);
      else telaFalha(resposta.mensagem);
    });
  }

  // API fora do ar: so a mensagem fixa de falha e a frase de emergencia.
  function telaFalha(mensagem) {
    const titulo = tituloDaTela(TEXTOS.nome);
    const falhou = no("p", "aviso", mensagem || TEXTOS.falha);
    const emergencia = no("p", "canais__emergencia", TEXTOS.emergencia);
    const tentar = no("button", "btn btn--contorno", TEXTOS.tentar);
    tentar.type = "button";
    tentar.addEventListener("click", function () { telaCarregando(true); });
    mostrar([titulo, falhou, emergencia, tentar], titulo, true);
  }

  function telaDemonstracao() {
    const titulo = tituloDaTela(TEXTOS.demo_titulo);
    const aviso = no("p", "aviso", TEXTOS.demo_aviso);
    aviso.setAttribute("role", "note");
    const canais = blocoCanais();
    canais.preencher(CANAIS_DEMONSTRACAO);
    mostrar([titulo, aviso, canais.secao], titulo, true);
  }

  function telaAceite(mensagem, focar) {
    const demonstracao = !apiAtiva(CONFIG);
    const fechado = !demonstracao && estado.saude.modo === "fechado";
    estado.sessao = null;
    estado.turnos = [];
    estado.houveRisco = false;
    estado.enviando = false;
    // As respostas da acolhida nao aparecem nesta tela e nao podem seguir, sem ninguem ver, para quem concordar agora.
    // A marca de risco do nome era da sessao que terminou: sai junto.
    estado.acolhida = acolhidaVazia();
    estado.marcaDeRisco = null;
    definirAvatar("acolhimento");

    // Gratuito com cadastro: so fora do modo fechado e quando o servidor o pede.
    const comCadastro = !demonstracao && !fechado && Boolean(estado.saude) && estado.saude.cadastro_gratuito === true;
    const titulo = tituloDaTela(TEXTOS.aceite_titulo);
    const texto = no("p", "aceite__texto", comCadastro ? TEXTOS.cadastro.aceite : TEXTOS.aceite);
    const formulario = no("form", "aceite");
    formulario.noValidate = true;
    const blocos = [titulo];
    const descritoPor = [];

    // Sessao que terminou com uma pergunta por responder: a pessoa sabe que o texto nao se perdeu.
    if (estado.rascunho) {
      const nota = no("div", "aviso rascunho");
      nota.id = "nota-rascunho";
      nota.setAttribute("role", "note");
      nota.appendChild(no("p", null, TEXTOS.rascunho_guardado));
      const apagar = no("button", "btn-mini", TEXTOS.rascunho_apagar);
      apagar.type = "button";
      apagar.addEventListener("click", function () {
        estado.rascunho = "";
        esvaziar(nota);
        const apagado = no("p", null, TEXTOS.rascunho_apagado);
        apagado.tabIndex = -1;
        nota.appendChild(apagado);
        trocou();
        apagado.focus();
      });
      nota.appendChild(apagar);
      blocos.push(nota);
      descritoPor.push("nota-rascunho");
    }
    blocos.push(texto);
    blocos.push(formulario);

    let convite = null;
    if (fechado) {
      const avisoTeste = no("p", "aviso", TEXTOS.aviso_teste);
      avisoTeste.setAttribute("role", "note");
      convite = campoDeTexto("campo-convite", TEXTOS.convite_rotulo, "text", CONFIG.convite_max);
      convite.entrada.setAttribute("autocomplete", "off");
      convite.entrada.setAttribute("autocapitalize", "none");
      convite.entrada.setAttribute("aria-describedby", "dica-convite status-aceite");
      // Sem codigo, a pessoa entra so no modo guiado: os botoes de tema nunca ficam trancados.
      const dicaConvite = no("p", "dica", TEXTOS.convite_dica);
      dicaConvite.id = "dica-convite";
      convite.campo.appendChild(dicaConvite);
      formulario.appendChild(avisoTeste);
      formulario.appendChild(convite.campo);
    }

    let cadastro = null;
    if (comCadastro) {
      const finalidade = no("p", "dica", TEXTOS.cadastro.finalidade);
      finalidade.id = "dica-cadastro";
      const nome = campoDeTexto("campo-nome-completo", TEXTOS.cadastro.nome_rotulo, "text", 120);
      // Aparelho do estande é compartilhado: o navegador não guarda nem sugere o nome de quem veio antes.
      nome.entrada.setAttribute("autocomplete", "off");
      nome.entrada.setAttribute("aria-describedby", "dica-cadastro status-aceite");
      const email = campoDeTexto("campo-email-gratuito", TEXTOS.cadastro.email_rotulo, "email", 254);
      email.entrada.setAttribute("autocomplete", "off");
      const maior = caixaDeMarcar("caixa-maior-gratuito", TEXTOS.cadastro.caixa_maior);
      const novidades = caixaDeMarcar("caixa-novidades", TEXTOS.cadastro.caixa_novidades);
      formulario.appendChild(finalidade);
      formulario.appendChild(nome.campo);
      formulario.appendChild(email.campo);
      formulario.appendChild(maior.rotulo);
      formulario.appendChild(novidades.rotulo);
      cadastro = { nome: nome.entrada, email: email.entrada, maior: maior.entrada, novidades: novidades.entrada };
    }

    const concordo = caixaDeMarcar("caixa-aceite", comCadastro ? TEXTOS.cadastro.caixa_aceite : TEXTOS.caixa_aceite);
    const caixaDesafio = no("div", "desafio");
    const status = linhaDeStatus("status-aceite");
    if (mensagem) {
      status.textContent = mensagem;
      descritoPor.unshift("status-aceite");
    }
    if (descritoPor.length > 0) titulo.setAttribute("aria-describedby", descritoPor.join(" "));
    const botao = no("button", "btn", TEXTOS.botao_comecar);
    botao.type = "submit";
    formulario.appendChild(concordo.rotulo);
    formulario.appendChild(caixaDesafio);
    formulario.appendChild(status);
    formulario.appendChild(botao);

    let desafio = null;
    let abrindo = false;

    function travar(travado) {
      concordo.entrada.disabled = travado;
      if (convite) convite.entrada.disabled = travado;
      if (cadastro) Object.keys(cadastro).forEach(function (chave) { cadastro[chave].disabled = travado; });
      travarBotao(botao, travado);
    }

    formulario.addEventListener("submit", function (evento) {
      evento.preventDefault();
      if (abrindo) return;
      let corpoDoCadastro = null;
      if (cadastro) {
        const lido = lerCadastroDoGratuito(valorDe(cadastro.nome), valorDe(cadastro.email), cadastro.maior.checked === true, cadastro.novidades.checked === true);
        if (!lido.ok) {
          status.textContent = TEXTOS.cadastro.erros[lido.campo];
          (lido.campo === "maior_de_18" ? cadastro.maior : lido.campo === "email" ? cadastro.email : cadastro.nome).focus();
          return;
        }
        corpoDoCadastro = lido.cadastro;
      }
      if (concordo.entrada.checked !== true) {
        status.textContent = TEXTOS.falta_caixa;
        concordo.entrada.focus();
        return;
      }
      if (demonstracao) {
        telaDemonstracao();
        return;
      }
      // O cadastro fica so na memoria desta pagina, para o "tentar de novo" da conversa; nunca no aparelho.
      estado.cadastro = corpoDoCadastro;
      const codigo = convite ? limparCodigo(valorDe(convite.entrada), CONFIG.convite_max) : "";
      if (!precisaDeSessao(estado.saude, codigo)) {
        telaConversa(null);
        return;
      }
      abrindo = true;
      travar(true);
      status.textContent = TEXTOS.abrindo;
      const serie = estado.serie;
      // O Turnstile so e pedido aqui, depois do aceite.
      if (!desafio) desafio = criarDesafio(caixaDesafio);
      desafio.pedirFicha().then(function (ficha) {
        return pedir("/api/sessao", {
          corpo: montarSessao({
            turnstile: ficha,
            aceite_versao: corpoDoCadastro ? CONFIG.versao_aceite_cadastro : CONFIG.versao_aceite,
            convite: codigo,
            convite_max: CONFIG.convite_max,
            cadastro: corpoDoCadastro
          })
        });
      }).then(null, function () {
        return lerRespostaApi(0, null);
      }).then(function (resposta) {
        if (serie !== estado.serie) return;
        abrindo = false;
        // Cadastro recusado: a pessoa corrige ali mesmo. Com sinal de risco no nome, a mensagem de seguranca.
        if (!resposta.ok && corpoDoCadastro && (resposta.erro === "cadastro_invalido" || resposta.erro === "cadastro_com_risco")) {
          travar(false);
          estado.cadastro = null;
          status.textContent = resposta.erro === "cadastro_com_risco" && resposta.seguranca
            ? resposta.seguranca
            : (TEXTOS.cadastro.erros[resposta.campo] || TEXTOS.cadastro.erros.cadastro);
          if (resposta.erro === "cadastro_com_risco") estado.riscoNaVisita = true;
          return;
        }
        const sessao = resposta.ok ? lerSessao(resposta.dados, Date.now(), CONFIG.sessao_validade_max_ms) : null;
        if (sessao) {
          estado.sessao = sessao;
          telaConversa(null);
        } else if (fechado) {
          // Codigo recusado ou falha: a pessoa corrige o codigo, tenta de novo ou entra sem codigo.
          // Esta tela nao tem botoes de tema, entao a mensagem fixa de falha nao serve aqui.
          travar(false);
          status.textContent = mensagemDaRecusa(TEXTOS, resposta, TEXTOS.falha_abrir);
        } else {
          // Fora do teste fechado, os botoes de tema nao dependem da sessao.
          telaConversa(resposta.mensagem || TEXTOS.falha);
        }
      });
    });

    // De volta de uma conversa, os canais de ajuda ja recebidos continuam na tela.
    if (estado.canais.length > 0) {
      const canais = blocoCanais();
      canais.preencher(estado.canais);
      blocos.push(canais.secao);
    }

    mostrar(blocos, titulo, focar);
    estado.aoSair = function () {
      if (desafio) desafio.remover();
    };
  }

  /* ---- Conversa ---- */

  function telaConversa(avisoInicial) {
    // A sessao pode abrir depois, por "tentar de novo", sem trocar de tela.
    let sessao = estado.sessao;
    let emTeste = Boolean(sessao) && sessao.tipo === "teste";
    const comEscrita = Boolean(sessao) && estado.saude.texto_livre === true;
    estado.turnos = [];
    estado.houveRisco = false;
    estado.enviando = false;

    const titulo = tituloDaTela(TEXTOS.conversa_titulo);
    const intro = no("p", "intro", comEscrita ? TEXTOS.conversa_intro : TEXTOS.conversa_intro_guiado);
    const blocos = [titulo, intro, montarControleDeLeitura()];
    // Convite com limite: quantos usos do codigo ja foram e quantos restam. Sem limite, a linha fica vazia.
    // E regiao viva sempre presente (nunca hidden): regiao que nasce oculta nao anuncia o primeiro texto, e a
    // sessao pode abrir depois, pelo codigo informado dentro da conversa, com o foco longe do alto da tela.
    const linhaDosUsos = no("p", "dica usos-convite");
    linhaDosUsos.id = "usos-convite";
    linhaDosUsos.setAttribute("role", "status");
    linhaDosUsos.setAttribute("aria-live", "polite");
    function mostrarUsos() {
      linhaDosUsos.textContent = textoDosUsos(TEXTOS, sessao ? sessao.usos : null);
    }
    mostrarUsos();
    blocos.push(linhaDosUsos);
    // Um aviso de gravacao so, por tela. Enquanto a acolhida ainda pode vir de /api/guiado, ele espera:
    // com acolhida, vale o aviso dela; sem acolhida, este, no lugar de sempre ("topo" ou "conversa").
    const lugarDoAviso = no("div", "lugar-aviso");
    blocos.push(lugarDoAviso);
    let avisoPendente = null;
    function avisoDeGravacaoNoTopo() {
      const notaTeste = no("p", "aviso", TEXTOS.aviso_teste);
      notaTeste.setAttribute("role", "note");
      lugarDoAviso.appendChild(notaTeste);
    }
    if (emTeste) {
      if (comEscrita && !estado.acolhida.feita) avisoPendente = "topo";
      else avisoDeGravacaoNoTopo();
    }

    const registro = no("div", "registro");
    registro.setAttribute("role", "log");
    registro.setAttribute("aria-live", "polite");
    registro.setAttribute("aria-relevant", "additions");
    registro.setAttribute("aria-label", TEXTOS.conversa_rotulo);
    const espera = no("p", "espera");
    espera.setAttribute("role", "status");
    espera.setAttribute("aria-live", "polite");
    blocos.push(registro);
    blocos.push(espera);
    // O aviso de entrada ja esta no registro quando a tela aparece: regiao viva nao anuncia o que
    // nasce junto com ela, entao o titulo, que recebe o foco, aponta para o aviso.
    if (avisoInicial) {
      const aviso = no("p", "msg msg--aviso", avisoInicial);
      aviso.id = "aviso-inicial";
      registro.appendChild(aviso);
      titulo.setAttribute("aria-describedby", "aviso-inicial");
    }

    // fechado | aberto | encerrado: o cartao aparece no maximo uma vez por sessao.
    let situacaoDoCartao = "fechado";
    let cartao = null;
    let desafioDoContato = null;
    let escrita = null;
    // Pergunta enviada e ainda sem resposta: se a sessao terminar nesse meio, ela nao se perde.
    let mensagemEmEnvio = null;
    const limpezas = [];
    // Quem acabou de abrir a sessao nesta tela recebe o foco no campo de escrita quando ele entrar.
    let focarAoLiberar = false;
    // O que /api/guiado trouxe por ultimo nesta tela, se ha pedido a caminho e se a acolhida esta em curso.
    let temasRecebidos = null;
    let acolhidaRecebida = null;
    let guiadoPendente = false;
    let emAcolhida = false;
    // Prazo da espera pela acolhida, enquanto /api/guiado nao responde.
    let prazoDaAcolhida = null;
    limpezas.push(function () { pararPrazoDaAcolhida(); });

    // Sessao vencida ou recusada: de volta ao aceite, sem perder a pergunta nem os canais de ajuda.
    function sessaoTerminou(aviso, pergunta) {
      desligarLeitura();
      const noCampo = escrita ? valorDe(escrita.campo).trim() : "";
      estado.rascunho = textoOuNulo(pergunta) || textoOuNulo(mensagemEmEnvio) || noCampo;
      telaAceite(aviso || TEXTOS.sessao_encerrada, true);
    }

    function acrescentar(elemento) {
      registro.appendChild(elemento);
      rolarAte(elemento);
      return elemento;
    }

    function bolha(classe, autor) {
      const caixa = no("div", "msg " + classe);
      caixa.appendChild(no("p", "msg__autor", autor));
      return caixa;
    }

    function avisoNaConversa(texto) {
      return acrescentar(no("p", "msg msg--aviso", texto));
    }

    function falaDaPessoa(texto) {
      const caixa = bolha("msg--pessoa", TEXTOS.autor_pessoa);
      caixa.appendChild(no("p", "msg__texto", texto));
      return acrescentar(caixa);
    }

    function respostaDoChat(chat, semServidor) {
      avisarV1("chat", chat);
      const caixa = bolha("msg--assistente msg--" + chat.tipo, TEXTOS.autor_assistente);
      caixa.appendChild(no("p", "msg__texto", chat.texto));
      let falado = chat.texto;
      // A linha de apoio vem separada da resposta, e assim aparece.
      if (chat.linha_apoio) {
        caixa.appendChild(no("p", "msg__apoio", chat.linha_apoio));
        falado += "\n" + chat.linha_apoio;
      }
      // "Saber mais": o texto da base, fechado por padrao, sem nova chamada ao servidor. A leitura em voz alta le
      // so a resposta; quem abre o "Saber mais" le com os proprios olhos ou com o leitor de tela.
      if (chat.tipo === "resposta" && chat.saber_mais && chat.saber_mais.length > 0) {
        const detalhes = no("details", "saber-mais");
        detalhes.appendChild(no("summary", "saber-mais__titulo", TEXTOS.saber_mais));
        chat.saber_mais.forEach(function (texto) {
          texto.split(/\n{2,}/).forEach(function (paragrafo) {
            if (paragrafo.trim() !== "") detalhes.appendChild(no("p", "saber-mais__texto", paragrafo.trim()));
          });
        });
        detalhes.appendChild(no("p", "saber-mais__nota", TEXTOS.saber_mais_nota));
        caixa.appendChild(detalhes);
      }
      if (emTeste && estado.sessao && estado.sessao.tecnico === true) {
        let tecnico = preencher(TEXTOS.tecnico_tipo, { tipo: chat.tipo });
        if (chat.base_ids.length > 0) tecnico += " · " + preencher(TEXTOS.tecnico_base, { ids: chat.base_ids.join(", ") });
        if (semServidor) tecnico += " · " + TEXTOS.tecnico_local;
        caixa.appendChild(no("p", "msg__tecnico", tecnico));
      }
      const acoes = no("div", "msg__acoes");
      caixa.appendChild(acoes);
      registrarOuvivel(acoes, falado);
      if (emTeste && chat.id_turno) acrescentarMarcacao(caixa, acoes, chat.id_turno);
      return acrescentar(caixa);
    }

    function falhaLocal() {
      definirAvatar("acolhimento");
      respostaDoChat(lerChat({ tipo: "falha", texto: TEXTOS.falha }), true);
    }

    // Duvida do tema: a pergunta escolhida, como fala da pessoa, e as respostas aprovadas, literais e na ordem, como
    // fala da assistente. Sem modelo, sem pedido ao servidor e sem gastar pergunta escrita. Nada de identificador.
    function respostaDaDuvida(duvida) {
      pararFala();
      falaDaPessoa(duvida.pergunta);
      const caixa = bolha("msg--assistente msg--guiada", TEXTOS.autor_assistente);
      duvida.respostas.forEach(function (resposta) {
        caixa.appendChild(no("p", "msg__texto", resposta));
      });
      const acoes = no("div", "msg__acoes");
      caixa.appendChild(acoes);
      registrarOuvivel(acoes, duvida.respostas.join("\n\n"));
      // "Perguntar do meu jeito" so existe com o campo de escrita na tela: leva o foco ate ele.
      if (escrita) {
        const seguir = no("div", "msg__acoes");
        const perguntar = no("button", "btn-mini", TEXTOS.perguntar_do_meu_jeito);
        perguntar.type = "button";
        perguntar.addEventListener("click", function () {
          if (!escrita) return;
          trocou();
          rolarAte(escrita.formulario);
          escrita.campo.focus();
        });
        seguir.appendChild(perguntar);
        caixa.appendChild(seguir);
      }
      definirAvatar("informacao");
      acrescentar(caixa);
      // A conversa cresceu acima dos temas: o segundo toque de um toque duplo nao cai em outro botao.
      trocou();
    }

    /* -- Acolhida: da pagina, em forma de conversa, so com os textos de /api/guiado. Nao gasta pergunta escrita.
          O unico pedido e o do nome escrito (POST /api/acolhida/nome), que passa pela regra de risco antes de virar
          nome; pular nao pede nada. As respostas ficam em estado.acolhida, so em memoria -- */

    function falaDaAcolhida(texto) {
      const caixa = bolha("msg--assistente msg--acolhida", TEXTOS.autor_assistente);
      const paragrafo = no("p", "msg__texto", texto);
      paragrafo.id = novoId("fala");
      caixa.appendChild(paragrafo);
      const acoes = no("div", "msg__acoes");
      caixa.appendChild(acoes);
      registrarOuvivel(acoes, texto);
      acrescentar(caixa);
      return { caixa: caixa, texto: paragrafo };
    }

    // Linha de apoio sem resposta antes dela (nome da acolhida com sinal ambiguo): fala da assistente, com o texto
    // que o Worker mandar, no mesmo destaque da linha de apoio do chat.
    function linhaDeApoioSozinha(texto) {
      avisarV1("apoio", texto);
      const caixa = bolha("msg--assistente msg--apoio", TEXTOS.autor_assistente);
      caixa.appendChild(no("p", "msg__apoio", texto));
      const acoes = no("div", "msg__acoes");
      caixa.appendChild(acoes);
      registrarOuvivel(acoes, texto);
      return acrescentar(caixa);
    }

    function comecarAcolhida() {
      const acolhida = acolhidaRecebida;
      const respostas = { como_chamar: null, diagnostico: null, motivo: null };
      emAcolhida = true;
      // O foco vai para a abertura, no fim, e nao para o campo de escrita.
      focarAoLiberar = false;
      // Vale o aviso da acolhida: o de gravacao de sempre nao entra nesta tela.
      avisoPendente = null;
      // Os temas e o campo de escrita entram depois da abertura. A leitura de um tema aberto sai com o painel escondido.
      pararPrazoDaAcolhida();
      pararFalaDoPainel();
      secaoTemas.hidden = true;
      definirAvatar("acolhimento");

      // Respondida a pergunta, os controles saem do balao e a resposta aparece como fala da pessoa.
      function responder(fala, controles, texto) {
        pararFala();
        fala.caixa.removeChild(controles);
        falaDaPessoa(texto);
        trocou();
      }

      function perguntarNome() {
        const fala = falaDaAcolhida(acolhida.pergunta_nome);
        const formulario = no("form", "acolhida__controles");
        formulario.noValidate = true;
        const campo = no("div", "campo");
        const entrada = no("input");
        entrada.type = "text";
        entrada.id = "campo-como-chamar";
        // O campo aceita a frase inteira, ate o teto da mensagem: a regra de risco do Worker precisa ver tudo o que
        // foi escrito, inclusive o que passa do 30o caractere. O teto do nome (como_chamar_max) vale so na limpeza.
        entrada.maxLength = CONFIG.mensagem_max;
        entrada.setAttribute("autocomplete", "off");
        entrada.setAttribute("autocapitalize", "words");
        entrada.setAttribute("spellcheck", "false");
        // O campo leva o nome da propria pergunta, sem rotulo a mais.
        entrada.setAttribute("aria-labelledby", fala.texto.id);
        campo.appendChild(entrada);
        const enviar = no("button", "btn", TEXTOS.botao_enviar);
        enviar.type = "submit";
        const pular = no("button", "btn btn--contorno", acolhida.rotulo_pular);
        pular.type = "button";
        let respondida = false;
        formulario.addEventListener("submit", function (evento) {
          evento.preventDefault();
          if (respondida) return;
          const bruto = valorDe(entrada);
          // A fala da pessoa mostra o que ela escreveu, inteiro; o nome, se houver, e o que o Worker devolver.
          const escrito = limparNome(bruto, CONFIG.mensagem_max);
          // Campo vazio: nada muda, e o foco volta ao campo. Para seguir sem nome, ha o botao de pular.
          if (escrito === "") {
            entrada.focus();
            return;
          }
          // Um envio so: os controles saem do balao e o que foi escrito aparece como fala da pessoa. O texto so vira
          // nome depois da regra de risco do Worker; ate a resposta, nada dele vai para a abertura.
          respondida = true;
          respostas.como_chamar = null;
          responder(fala, formulario, escrito);
          conferirNome(bruto, function (conferido) {
            respostas.como_chamar = conferido.como_chamar;
            perguntarDiagnostico(!conferido.foco);
            if (conferido.foco) conferido.foco.focus();
          });
        });
        pular.addEventListener("click", function () {
          if (respondida) return;
          respondida = true;
          respostas.como_chamar = null;
          responder(fala, formulario, acolhida.rotulo_pular);
          perguntarDiagnostico();
        });
        formulario.appendChild(campo);
        formulario.appendChild(enviar);
        formulario.appendChild(pular);
        fala.caixa.appendChild(formulario);
      }

      // POST /api/acolhida/nome com o texto como foi escrito: o Worker roda a regra de risco nele antes de limpar.
      // Sem sinal, vale o nome que ele devolveu. Com sinal explicito, a mensagem de seguranca como fala da assistente,
      // com o destaque dela; com sinal ambiguo, a linha de apoio. Nos dois, sem nome, risco na visita (nada de
      // convite nem de oferta) e a fala assinada guardada para seguir na frente do historico de todo chat da sessao.
      // Falha ou resposta fora do contrato: segue sem nome. Sem resposta legivel do Worker (rede, prazo, resposta que
      // nao e JSON), a pagina nao sabe se o texto trazia sinal de risco: vale como se trouxesse, como no chat.
      // seguir({ como_chamar, foco }): foco e a fala que deve receber o foco antes da pergunta seguinte, ou null.
      function conferirNome(bruto, seguir) {
        const serie = estado.serie;
        const token = sessao ? sessao.token : null;
        espera.textContent = TEXTOS.espera;
        definirAvatar("escuta");
        pedir("/api/acolhida/nome", {
          corpo: { como_chamar: bruto.slice(0, CONFIG.mensagem_max) },
          token: token
        }).then(function (resposta) {
          if (serie !== estado.serie) return;
          espera.textContent = "";
          const conferido = resposta.ok ? lerNomeConferido(resposta.dados, CONFIG.como_chamar_max) : null;
          let foco = null;
          if (!conferido) {
            if (resposta.ok || !resposta.mensagem) marcarRisco();
            definirAvatar("acolhimento");
          } else {
            if (conferido.risco) {
              marcarRisco();
              if (conferido.marca && token) estado.marcaDeRisco = { token: token, fala: conferido.marca };
            }
            definirAvatar(conferido.estado);
            if (conferido.tipo === "seguranca") {
              foco = respostaDoChat(lerChat({
                tipo: "seguranca", texto: conferido.texto, estado: conferido.estado, linha_apoio: conferido.linha_apoio
              }), false);
            } else if (conferido.linha_apoio) {
              foco = linhaDeApoioSozinha(conferido.linha_apoio);
            }
          }
          if (foco) foco.tabIndex = -1;
          // Os controles da pergunta seguinte surgem agora: o toque que chegar junto nao cai neles.
          trocou();
          seguir({ como_chamar: conferido ? conferido.como_chamar : null, foco: foco });
        });
      }

      // Pergunta com botoes de resposta: um toque escolhe, e so o primeiro vale.
      function perguntarComOpcoes(pergunta, opcoes, aoEscolher, focar) {
        const fala = falaDaAcolhida(pergunta);
        const grupo = no("div", "acolhida__controles");
        grupo.setAttribute("role", "group");
        grupo.setAttribute("aria-labelledby", fala.texto.id);
        let escolhida = false;
        const botoes = opcoes.map(function (opcao) {
          const botao = no("button", "btn btn--contorno", opcao.rotulo);
          botao.type = "button";
          botao.addEventListener("click", function () {
            if (escolhida) return;
            escolhida = true;
            responder(fala, grupo, opcao.rotulo);
            aoEscolher(opcao.valor);
          });
          grupo.appendChild(botao);
          return botao;
        });
        fala.caixa.appendChild(grupo);
        if (focar !== false) botoes[0].focus();
      }

      // focar false: o foco fica onde esta (na mensagem de seguranca ou na linha de apoio, que precisa ser lida antes).
      function perguntarDiagnostico(focar) {
        const opcoes = acolhida.opcoes_diagnostico.map(function (opcao) {
          return { valor: opcao.id, rotulo: opcao.rotulo };
        }).concat([{ valor: "nao_informado", rotulo: acolhida.rotulo_sem_resposta }]);
        perguntarComOpcoes(acolhida.pergunta_diagnostico, opcoes, function (valor) {
          respostas.diagnostico = valor;
          if (valor === "nao") perguntarMotivo();
          else concluir();
        }, focar);
      }

      // So depois de "nao". "Prefiro nao responder" tambem vale aqui e leva a abertura sem_resposta.
      function perguntarMotivo() {
        const opcoes = acolhida.opcoes_motivo.map(function (opcao) {
          return { valor: opcao.id, rotulo: opcao.rotulo };
        }).concat([{ valor: null, rotulo: acolhida.rotulo_sem_resposta }]);
        perguntarComOpcoes(acolhida.pergunta_motivo, opcoes, function (valor) {
          respostas.motivo = valor;
          concluir();
        });
      }

      // A frase de abertura certa e, entao, os temas e o campo de escrita.
      function concluir() {
        estado.acolhida = { feita: true, como_chamar: respostas.como_chamar, diagnostico: respostas.diagnostico, motivo: respostas.motivo };
        const abertura = falaDaAcolhida(textoDaAbertura(acolhida, respostas));
        emAcolhida = false;
        secaoTemas.hidden = false;
        painelDeTemas(temasRecebidos || [], false);
        liberarEscrita();
        trocou();
        abertura.texto.tabIndex = -1;
        abertura.texto.focus();
      }

      falaDaAcolhida(acolhida.apresentacao);
      avisoNaConversa(avisoDaAcolhida(acolhida, sessao.tipo));
      perguntarNome();
      trocou();
    }

    /* -- Sessao de teste: marcar problema -- */

    function acrescentarMarcacao(caixa, acoes, idTurno) {
      const textos = TEXTOS.marcacao;
      const botao = no("button", "btn-mini", TEXTOS.marcar_problema);
      botao.type = "button";
      botao.setAttribute("aria-expanded", "false");
      const lugar = no("div", "marcacao");
      let aberto = false;
      let enviando = false;

      function fechar() {
        aberto = false;
        botao.setAttribute("aria-expanded", "false");
        esvaziar(lugar);
      }

      function abrir() {
        aberto = true;
        botao.setAttribute("aria-expanded", "true");
        const formulario = no("form");
        formulario.noValidate = true;
        const grupo = no("fieldset", "grupo");
        grupo.appendChild(no("legend", null, textos.legenda));
        const nomeDoGrupo = novoId("motivo");
        const opcoes = textos.motivos.map(function (motivo) {
          const opcao = caixaDeMarcar(novoId("opcao"), motivo.rotulo, "radio", nomeDoGrupo);
          opcao.entrada.value = motivo.valor;
          grupo.appendChild(opcao.rotulo);
          return opcao.entrada;
        });
        const campo = no("div", "campo");
        const idComentario = novoId("comentario");
        const rotulo = no("label", null, textos.comentario_rotulo);
        rotulo.htmlFor = idComentario;
        const comentario = no("textarea");
        comentario.id = idComentario;
        comentario.rows = 3;
        comentario.maxLength = CONFIG.comentario_max;
        const contador = no("p", "contador");
        const contar = function () {
          contador.textContent = preencher(TEXTOS.contador, { n: valorDe(comentario).length, max: CONFIG.comentario_max });
        };
        comentario.addEventListener("input", contar);
        contar();
        campo.appendChild(rotulo);
        campo.appendChild(comentario);
        campo.appendChild(contador);
        const status = linhaDeStatus(novoId("status-marcacao"));
        const enviar = no("button", "btn", textos.enviar);
        enviar.type = "submit";
        const cancelar = no("button", "btn btn--contorno", textos.cancelar);
        cancelar.type = "button";
        cancelar.addEventListener("click", function () {
          if (enviando) return;
          fechar();
          botao.focus();
        });
        formulario.appendChild(grupo);
        formulario.appendChild(campo);
        formulario.appendChild(status);
        formulario.appendChild(enviar);
        formulario.appendChild(cancelar);
        formulario.addEventListener("submit", function (evento) {
          evento.preventDefault();
          if (enviando) return;
          const escolhida = opcoes.filter(function (entrada) { return entrada.checked === true; })[0];
          const motivo = escolhida ? escolhida.value : "";
          if (!motivoValido(motivo, textos.motivos)) {
            status.textContent = textos.falta_motivo;
            opcoes[0].focus();
            return;
          }
          enviando = true;
          travarBotao(enviar, true);
          status.textContent = textos.enviando;
          const serie = estado.serie;
          pedir("/api/feedback", {
            token: estado.sessao.token,
            corpo: montarFeedback({
              id_turno: idTurno,
              motivo: motivo,
              comentario: valorDe(comentario),
              comentario_max: CONFIG.comentario_max
            })
          }).then(function (resposta) {
            if (serie !== estado.serie) return;
            enviando = false;
            if (resposta.ok) {
              aberto = false;
              esvaziar(lugar);
              const confirmacao = no("p", "marcacao__ok", textos.sucesso);
              confirmacao.tabIndex = -1;
              lugar.appendChild(confirmacao);
              if (botao.parentNode) botao.parentNode.removeChild(botao);
              confirmacao.focus();
              return;
            }
            if (tokenRecusado(resposta)) {
              sessaoTerminou(resposta.mensagem, null);
              return;
            }
            travarBotao(enviar, false);
            status.textContent = resposta.mensagem || textos.falha;
          });
        });
        lugar.appendChild(formulario);
        trocou();
        rolarAte(lugar);
      }

      botao.addEventListener("click", function () {
        if (enviando) return;
        if (aberto) fechar();
        else abrir();
      });
      acoes.appendChild(botao);
      caixa.appendChild(lugar);
    }

    function tokenRecusado(resposta) {
      return resposta.erro === "token_invalido" || resposta.status === 401;
    }

    /* -- Cartao de convite: texto fixo, nunca escrito pelo modelo -- */

    function encerrarContato() {
      if (desafioDoContato) desafioDoContato.remover();
      desafioDoContato = null;
    }

    // Sinal de risco: nenhum convite ate o fim da sessao, e o cartao aberto sai da tela.
    function retirarCartao() {
      encerrarContato();
      if (cartao && cartao.parentNode) cartao.parentNode.removeChild(cartao);
      cartao = null;
      situacaoDoCartao = "encerrado";
    }

    function mostrarCartao() {
      if (situacaoDoCartao !== "fechado") return;
      situacaoDoCartao = "aberto";
      cartao = no("section", "cartao-convite");
      cartao.setAttribute("aria-label", TEXTOS.cartao.rotulo);
      cartaoInicial();
      acrescentar(cartao);
      trocou();
    }

    // Emoji depois do texto, escondido do leitor de tela.
    function comEmoji(elemento, emoji) {
      if (!emoji) return elemento;
      elemento.appendChild(document.createTextNode(" "));
      const marca = no("span", null, emoji);
      marca.setAttribute("aria-hidden", "true");
      elemento.appendChild(marca);
      return elemento;
    }

    function separadorDoCartao() {
      const linha = no("hr", "conversao__separador");
      linha.setAttribute("aria-hidden", "true");
      return linha;
    }

    // "Conheca a EndoAfetos!": texto, as duas ofertas da assistente e o botao para o site.
    function blocoConheca(textos) {
      const secao = no("section", "conversao__conheca");
      const titulo = no("h3", null, textos.conheca_titulo);
      titulo.id = novoId("titulo-conheca");
      secao.setAttribute("aria-labelledby", titulo.id);
      secao.appendChild(titulo);
      secao.appendChild(no("p", null, textos.conheca_texto));
      secao.appendChild(no("p", null, textos.ofertas_intro));
      const lista = no("ul", "conversao__ofertas");
      textos.ofertas.forEach(function (oferta) {
        const item = no("li", "conversao__oferta");
        item.appendChild(no("span", "conversao__oferta-titulo", oferta.titulo));
        item.appendChild(no("span", "conversao__oferta-texto", oferta.texto));
        lista.appendChild(item);
      });
      secao.appendChild(lista);
      const endereco = enderecoSeguro(CONFIG.link_conhecer);
      if (endereco) {
        const botao = no("a", "btn btn--conheca", textos.conheca_botao);
        botao.href = endereco;
        // Em outra aba: a conversa fica so em memoria e some se esta pagina for trocada.
        botao.target = "_blank";
        botao.rel = "noopener noreferrer";
        const seta = no("span", "btn__seta", " " + textos.conheca_seta);
        seta.setAttribute("aria-hidden", "true");
        botao.appendChild(seta);
        secao.appendChild(botao);
      }
      return secao;
    }

    // Brinde do estande, so com CONFIG.evento_btx.
    function blocoPresente(textos) {
      const secao = no("section", "conversao__presente");
      const titulo = no("h3", null, textos.evento_titulo);
      titulo.id = novoId("titulo-presente");
      secao.setAttribute("aria-labelledby", titulo.id);
      secao.appendChild(titulo);
      secao.appendChild(comEmoji(no("p", "conversao__destaque", textos.brinde_destaque), textos.brinde_emoji));
      secao.appendChild(no("p", "conversao__brinde", textos.brinde));
      return secao;
    }

    // Cartao de conversao, no padrao da tela final do quiz. "Quero que me procurem" so com a coleta ligada.
    function cartaoInicial() {
      const textos = TEXTOS.cartao;
      esvaziar(cartao);
      cartao.appendChild(comEmoji(no("h2", "conversao__titulo", textos.titulo), textos.titulo_emoji));
      cartao.appendChild(no("p", "conversao__cuidado", textos.cuidado));
      cartao.appendChild(no("p", "conversao__encerramento", textos.encerramento));
      cartao.appendChild(blocoConheca(textos));
      if (CONFIG.evento_btx === true) {
        cartao.appendChild(separadorDoCartao());
        cartao.appendChild(blocoPresente(textos));
      }
      if (estado.saude.coleta === true) {
        const quero = no("button", "btn", textos.quero);
        quero.type = "button";
        quero.addEventListener("click", cartaoContato);
        cartao.appendChild(quero);
      }
      const agoraNao = no("button", "btn btn--contorno", textos.agora_nao);
      agoraNao.type = "button";
      agoraNao.addEventListener("click", function () {
        encerrarContato();
        situacaoDoCartao = "encerrado";
        esvaziar(cartao);
        const dispensado = no("p", null, textos.dispensado);
        dispensado.tabIndex = -1;
        cartao.appendChild(dispensado);
        trocou();
        dispensado.focus();
      });
      cartao.appendChild(agoraNao);
    }

    function cartaoContato() {
      const textos = TEXTOS.contato;
      esvaziar(cartao);
      const tituloContato = no("h3", "cartao-convite__titulo", textos.titulo);
      tituloContato.tabIndex = -1;
      const formulario = no("form", "contato");
      formulario.noValidate = true;
      // Aparelho que pode ser de varias pessoas (estande): o navegador nao deve guardar nem sugerir nome e e-mail.
      const nome = campoDeTexto("campo-nome", textos.nome_rotulo, "text", CONFIG.nome_max);
      nome.entrada.setAttribute("autocomplete", "off");
      nome.entrada.setAttribute("autocapitalize", "words");
      const email = campoDeTexto("campo-email", textos.email_rotulo, "email", CONFIG.email_max);
      email.entrada.setAttribute("inputmode", "email");
      email.entrada.setAttribute("autocomplete", "off");
      email.entrada.setAttribute("autocapitalize", "none");
      const aceita = caixaDeMarcar("caixa-contato", textos.caixa_contato);
      const maior = caixaDeMarcar("caixa-maior", textos.caixa_maior);
      const oQueSegue = no("p", "dica", textos.o_que_segue);
      const caixaDesafio = no("div", "desafio");
      const status = linhaDeStatus("status-contato");
      nome.entrada.setAttribute("aria-describedby", "status-contato");
      email.entrada.setAttribute("aria-describedby", "status-contato");
      const botao = no("button", "btn", textos.botao);
      botao.type = "submit";
      const desistir = no("button", "btn btn--contorno", TEXTOS.cartao.agora_nao);
      desistir.type = "button";

      // Desafio proprio do formulario: a ficha da sessao nao e reaproveitada.
      const desafio = criarDesafio(caixaDesafio);
      desafioDoContato = desafio;
      let situacao = "parado";

      function travar(travado) {
        [nome.entrada, email.entrada, aceita.entrada, maior.entrada].forEach(function (controle) {
          controle.disabled = travado;
        });
        travarBotao(botao, travado);
      }

      desistir.addEventListener("click", function () {
        if (situacao === "enviando") return;
        encerrarContato();
        cartaoInicial();
        trocou();
      });

      formulario.addEventListener("submit", function (evento) {
        evento.preventDefault();
        if (situacao === "enviando" || situacao === "enviado") return;
        const campos = {
          nome: valorDe(nome.entrada),
          email: valorDe(email.entrada),
          contato: aceita.entrada.checked === true,
          maior_de_18: maior.entrada.checked === true
        };
        const erro = validarContato(campos, { nome_max: CONFIG.nome_max, email_max: CONFIG.email_max });
        if (erro) {
          status.textContent = textos.erros[erro];
          if (erro === "falta_nome") nome.entrada.focus();
          else if (erro === "falta_contato") aceita.entrada.focus();
          else if (erro === "falta_maior") maior.entrada.focus();
          else email.entrada.focus();
          return;
        }
        situacao = "enviando";
        travar(true);
        status.textContent = textos.enviando;
        const serie = estado.serie;
        desafio.pedirFicha().then(function (ficha) {
          // Sem token de sessao e sem nada da conversa: so os campos deste formulario.
          return pedir("/api/contatos", {
            corpo: montarContato({
              nome: campos.nome,
              nome_max: CONFIG.nome_max,
              email: campos.email,
              contato: campos.contato,
              maior_de_18: campos.maior_de_18,
              versao_textos: TEXTOS.versao,
              turnstile: ficha
            })
          });
        }).then(null, function () {
          return lerRespostaApi(0, null);
        }).then(function (resposta) {
          if (serie !== estado.serie || desafioDoContato !== desafio) return;
          if (resposta.ok) {
            situacao = "enviado";
            situacaoDoCartao = "encerrado";
            encerrarContato();
            esvaziar(cartao);
            const sucesso = no("p", null, textos.sucesso);
            sucesso.tabIndex = -1;
            cartao.appendChild(sucesso);
            sucesso.focus();
          } else {
            situacao = "falhou";
            travar(false);
            botao.textContent = textos.tentar;
            status.textContent = resposta.mensagem || textos.falha;
          }
        });
      });

      formulario.appendChild(nome.campo);
      formulario.appendChild(email.campo);
      formulario.appendChild(aceita.rotulo);
      formulario.appendChild(maior.rotulo);
      formulario.appendChild(oQueSegue);
      formulario.appendChild(caixaDesafio);
      formulario.appendChild(status);
      formulario.appendChild(botao);
      formulario.appendChild(desistir);
      cartao.appendChild(tituloContato);
      cartao.appendChild(formulario);
      trocou();
      tituloContato.focus();
    }

    /* -- Texto livre: so com sessao aberta e texto_livre ligado -- */

    // O campo de escrita, o aviso de codigo ou o "tentar de novo" ocupam o mesmo lugar na tela.
    const lugarDaEscrita = no("div", "lugar-escrita");
    blocos.push(lugarDaEscrita);

    function montarEscrita() {
      const formulario = no("form", "escrita");
      formulario.noValidate = true;
      const rotulo = no("label", "escrita__rotulo", TEXTOS.escrita_rotulo);
      rotulo.htmlFor = "campo-mensagem";
      const limite = no("p", "dica");
      limite.id = "dica-limite";
      const campo = no("textarea", "escrita__campo");
      campo.id = "campo-mensagem";
      campo.rows = 3;
      campo.maxLength = CONFIG.mensagem_max;
      campo.setAttribute("autocomplete", "off");
      campo.setAttribute("aria-describedby", "dica-limite contador-mensagem status-mensagem");
      const contador = no("p", "contador");
      contador.id = "contador-mensagem";
      const status = linhaDeStatus("status-mensagem");
      const botao = no("button", "btn", TEXTOS.botao_enviar);
      botao.type = "submit";
      let jaEnviou = false;

      function contar() {
        contador.textContent = preencher(TEXTOS.contador, { n: valorDe(campo).length, max: CONFIG.mensagem_max });
      }

      // Antes da primeira mensagem, a sessao avisa quantas perguntas responde: o limite que veio dela, na versao
      // gratuita e tambem no teste (o ambiente de teste tem 3 interacoes, como a gratuita). Depois, quantas restam.
      // Sessao sem limite informado nao mostra aviso.
      function mostrarRestantes() {
        const restantes = sessao.restantes !== null ? sessao.restantes : sessao.limite;
        const doLimite = sessao.limite !== null ? sessao.limite : sessao.restantes;
        const numero = jaEnviou ? restantes : doLimite;
        if (numero === null) {
          limite.textContent = "";
          return;
        }
        limite.textContent = jaEnviou
          ? preencher(TEXTOS.restantes, { n: numero })
          : avisoDeLimite(TEXTOS, numero);
      }

      // O campo fica no fluxo da pagina; ao abrir o teclado, a pagina rola ate ele.
      function manterVisivel() {
        setTimeout(function () {
          if (document.activeElement !== campo) return;
          try {
            formulario.scrollIntoView({ block: "nearest", behavior: "auto" });
          } catch (falha) {
            formulario.scrollIntoView(false);
          }
        }, CONFIG.espera_teclado_ms);
      }
      campo.addEventListener("focus", manterVisivel);
      const visor = window.visualViewport;
      if (visor && typeof visor.addEventListener === "function") {
        visor.addEventListener("resize", manterVisivel);
        limpezas.push(function () { visor.removeEventListener("resize", manterVisivel); });
      }
      campo.addEventListener("input", contar);

      // Sem resposta (falha, erro do contrato): a pergunta volta ao campo, se ele ainda estiver vazio.
      function devolver(mensagem) {
        if (valorDe(campo) !== "") return;
        campo.value = mensagem;
        contar();
        status.textContent = TEXTOS.pergunta_no_campo;
      }

      function enviar() {
        if (estado.enviando || !estado.sessao) return;
        const erro = validarMensagem(valorDe(campo), CONFIG.mensagem_max);
        if (erro) {
          status.textContent = erro === "vazia"
            ? TEXTOS.mensagem_vazia
            : preencher(TEXTOS.mensagem_grande, { max: CONFIG.mensagem_max });
          campo.focus();
          return;
        }
        const mensagem = valorDe(campo).trim();
        pararFala();
        // Segue mesmo com a sessao vencida pelo relogio deste aparelho: com sinal de risco, o Worker ainda
        // responde (mensagem de seguranca ou linha de apoio); sem sinal, o 401 leva ao aceite com a pergunta guardada.
        status.textContent = "";
        estado.enviando = true;
        travarBotao(botao, true);
        estado.turnos = semFalaRepetida(estado.turnos, mensagem);
        // As respostas da acolhida seguem em todo pedido de conversa, e so nele. A marca de risco do nome, quando
        // houve, vai na frente do historico, so na sessao em que o Worker a assinou.
        const marca = estado.marcaDeRisco && estado.marcaDeRisco.token === estado.sessao.token ? estado.marcaDeRisco.fala : null;
        const corpo = montarCorpoChat(mensagem, estado.turnos, {
          max_turnos: CONFIG.historico_max_turnos,
          max_caracteres: CONFIG.historico_max_caracteres,
          max_bytes: CONFIG.corpo_chat_max_bytes
        }, montarContexto(estado.acolhida, CONFIG.como_chamar_max), marca);
        // A fala da pessoa entra no historico mesmo se a resposta falhar:
        // o Worker confere sinal de risco tambem nas falas anteriores.
        guardarTurno({ papel: "pessoa", texto: mensagem, assinatura: null });
        falaDaPessoa(mensagem);
        mensagemEmEnvio = mensagem;
        campo.value = "";
        contar();
        jaEnviou = true;
        espera.textContent = TEXTOS.espera;
        definirAvatar("escuta");
        const serie = estado.serie;
        pedir("/api/chat", { corpo: corpo, token: estado.sessao.token, espera: CONFIG.espera_chat_ms })
          .then(function (resposta) {
            if (serie !== estado.serie) return;
            mensagemEmEnvio = null;
            estado.enviando = false;
            travarBotao(botao, false);
            espera.textContent = "";
            const semResposta = tratarChat(resposta, mensagem);
            if (serie !== estado.serie) return;
            if (semResposta) devolver(mensagem);
            mostrarRestantes();
          });
      }

      formulario.addEventListener("submit", function (evento) {
        evento.preventDefault();
        enviar();
      });

      formulario.appendChild(rotulo);
      formulario.appendChild(limite);
      formulario.appendChild(campo);
      formulario.appendChild(no("p", "dica dica-microfone", TEXTOS.dica_microfone));
      formulario.appendChild(contador);
      formulario.appendChild(status);
      formulario.appendChild(botao);
      // Pergunta guardada quando a sessao anterior terminou: volta ao campo, sem ser enviada sozinha.
      if (estado.rascunho) {
        campo.value = estado.rascunho.slice(0, CONFIG.mensagem_max);
        estado.rascunho = "";
        status.textContent = TEXTOS.pergunta_no_campo;
      }
      contar();
      mostrarRestantes();
      return { formulario: formulario, campo: campo };
    }

    // A pessoa ja concordou nesta tela: a sessao e pedida daqui, com ficha nova do Turnstile,
    // sem recarregar a pagina e sem novo aceite.
    function pedirSessaoAqui(desafio, codigo) {
      return desafio.pedirFicha().then(function (ficha) {
        return pedir("/api/sessao", {
          corpo: montarSessao({
            turnstile: ficha,
            aceite_versao: estado.cadastro ? CONFIG.versao_aceite_cadastro : CONFIG.versao_aceite,
            convite: codigo,
            convite_max: CONFIG.convite_max,
            cadastro: estado.cadastro
          })
        });
      }).then(null, function () {
        return lerRespostaApi(0, null);
      });
    }

    // Sessao aberta com a conversa na tela: nada do que esta na tela e apagado. Se a sessao for de teste, os temas
    // (e a acolhida) sao pedidos de novo com o token. Com o texto livre ligado, vem a acolhida, se ainda nao foi
    // feita nesta conversa e /api/guiado a trouxer; sem ela, o campo de escrita, com o foco.
    function sessaoAbriuAqui(nova) {
      estado.sessao = nova;
      sessao = nova;
      mostrarUsos();
      esvaziar(lugarDaEscrita);
      const comTexto = estado.saude.texto_livre === true;
      const esperaAcolhida = comTexto && !estado.acolhida.feita;
      if (comTexto) {
        intro.textContent = TEXTOS.conversa_intro;
        focarAoLiberar = true;
      }
      if (nova.tipo === "teste") {
        emTeste = true;
        if (esperaAcolhida) avisoPendente = "conversa";
        else avisoNaConversa(TEXTOS.aviso_teste);
      }
      trocou();
      if (nova.tipo === "teste") {
        if (!esperaAcolhida) liberarEscrita();
        carregarGuiado(false);
        if (esperaAcolhida) esperarAcolhida();
      } else if (!guiadoPendente) {
        // Sessao livre: os temas da tela ja sao os dela, e a acolhida que veio com eles vale a partir de agora.
        seguirSemPedido();
      } else if (esperaAcolhida) {
        esperarAcolhida();
      }
      if (escrita) return;
      // Sem campo de escrita (ainda), o foco fica na conversa ou, sem texto livre, nos temas que o codigo liberou.
      if (comTexto) titulo.focus();
      else tituloTemas.focus();
    }

    // Sem sessao no modo fechado: o codigo de convite e informado aqui mesmo, sem voltar ao aceite.
    // Vale tambem com o texto livre desligado, porque o codigo libera os temas em revisao. A dica fala
    // de escrever perguntas, entao so aparece quando o texto livre esta ligado.
    function montarSemCodigo() {
      const formulario = no("form", "reabrir");
      formulario.noValidate = true;
      const comDica = estado.saude.texto_livre === true;
      const dica = comDica ? no("p", "dica", TEXTOS.sem_codigo) : null;
      if (dica) dica.id = "dica-sem-codigo";
      const convite = campoDeTexto("campo-convite", TEXTOS.convite_rotulo, "text", CONFIG.convite_max);
      convite.entrada.setAttribute("autocomplete", "off");
      convite.entrada.setAttribute("autocapitalize", "none");
      convite.entrada.setAttribute("aria-describedby", comDica ? "dica-sem-codigo status-reabrir" : "status-reabrir");
      const caixaDesafio = no("div", "desafio");
      const status = linhaDeStatus("status-reabrir");
      const botao = no("button", "btn btn--contorno", TEXTOS.informar_codigo);
      botao.type = "submit";
      const desafio = criarDesafio(caixaDesafio);
      limpezas.push(function () { desafio.remover(); });
      let abrindo = false;

      function travar(travado) {
        convite.entrada.disabled = travado;
        travarBotao(botao, travado);
      }

      formulario.addEventListener("submit", function (evento) {
        evento.preventDefault();
        if (abrindo) return;
        const codigo = limparCodigo(valorDe(convite.entrada), CONFIG.convite_max);
        // Campo vazio: o foco vai para ele, e a dica ligada ao campo diz o que falta.
        if (codigo === "") {
          convite.entrada.focus();
          return;
        }
        abrindo = true;
        travar(true);
        status.textContent = TEXTOS.abrindo;
        const serie = estado.serie;
        pedirSessaoAqui(desafio, codigo).then(function (resposta) {
          if (serie !== estado.serie) return;
          abrindo = false;
          const nova = resposta.ok ? lerSessao(resposta.dados, Date.now(), CONFIG.sessao_validade_max_ms) : null;
          if (!nova) {
            // Codigo recusado ou falha: a pessoa corrige e tenta de novo, sem sair da conversa.
            travar(false);
            status.textContent = mensagemDaRecusa(TEXTOS, resposta, TEXTOS.falha_abrir);
            return;
          }
          desafio.remover();
          sessaoAbriuAqui(nova);
        });
      });

      if (dica) formulario.appendChild(dica);
      formulario.appendChild(convite.campo);
      formulario.appendChild(caixaDesafio);
      formulario.appendChild(status);
      formulario.appendChild(botao);
      return formulario;
    }

    // Sessao que nao abriu fora do modo fechado (rede lenta, Turnstile, muitas tentativas):
    // a pessoa tenta de novo daqui. Sem codigo, a sessao que abre e livre.
    function montarReabertura() {
      const bloco = no("div", "reabrir");
      const caixaDesafio = no("div", "desafio");
      const status = linhaDeStatus("status-reabrir");
      const botao = no("button", "btn btn--contorno", TEXTOS.reabrir_botao);
      botao.type = "button";
      const desafio = criarDesafio(caixaDesafio);
      limpezas.push(function () { desafio.remover(); });
      let abrindo = false;
      botao.addEventListener("click", function () {
        if (abrindo) return;
        abrindo = true;
        travarBotao(botao, true);
        status.textContent = TEXTOS.abrindo;
        const serie = estado.serie;
        pedirSessaoAqui(desafio, "").then(function (resposta) {
          if (serie !== estado.serie) return;
          abrindo = false;
          const nova = resposta.ok ? lerSessao(resposta.dados, Date.now(), CONFIG.sessao_validade_max_ms) : null;
          if (!nova) {
            travarBotao(botao, false);
            status.textContent = resposta.mensagem || TEXTOS.falha;
            return;
          }
          desafio.remover();
          sessaoAbriuAqui(nova);
        });
      });
      bloco.appendChild(no("p", "dica", TEXTOS.reabrir_dica));
      bloco.appendChild(caixaDesafio);
      bloco.appendChild(status);
      bloco.appendChild(botao);
      return bloco;
    }

    // O campo de escrita entra uma vez por tela, com sessao aberta e texto livre ligado.
    function liberarEscrita() {
      if (escrita || !sessao || estado.saude.texto_livre !== true) return;
      escrita = montarEscrita();
      esvaziar(lugarDaEscrita);
      lugarDaEscrita.appendChild(escrita.formulario);
      if (focarAoLiberar) {
        focarAoLiberar = false;
        trocou();
        escrita.campo.focus();
      }
    }

    // Com a sessao aberta e a acolhida ainda por fazer, o campo espera a resposta de /api/guiado: com acolhida,
    // ela vem antes; sem acolhida, o campo entra logo que a resposta chega. A espera tem prazo (esperarAcolhida).
    // Feita a acolhida, entra ja.
    if (comEscrita) {
      if (estado.acolhida.feita) liberarEscrita();
      else esperarAcolhida();
    } else if (!sessao && estado.saude.modo === "fechado") {
      lugarDaEscrita.appendChild(montarSemCodigo());
    } else if (!sessao && estado.saude.texto_livre === true) {
      lugarDaEscrita.appendChild(montarReabertura());
    }

    function guardarTurno(turno) {
      estado.turnos.push(turno);
      estado.turnos = prepararHistorico(estado.turnos, CONFIG.historico_max_turnos, CONFIG.historico_max_caracteres);
    }

    // Sinal de risco: nenhum convite nem oferta ate o fim da sessao, e as ofertas nao voltam nesta visita.
    function marcarRisco() {
      estado.houveRisco = true;
      retirarCartao();
      retirarOfertas();
    }

    // Devolve true quando a pergunta ficou sem resposta (falha ou erro do contrato).
    // Sem resposta legivel do Worker, a pagina nao sabe se a pergunta trazia sinal de risco: vale como se trouxesse.
    function tratarChat(resposta, mensagem) {
      if (!resposta.ok) {
        // Token expirado ou invalido: de volta ao aceite, com a pergunta guardada.
        if (tokenRecusado(resposta)) {
          sessaoTerminou(resposta.mensagem, mensagem);
          return false;
        }
        // Erro do contrato: a mensagem recebida. Sem mensagem, a fixa de falha.
        if (resposta.mensagem) {
          definirAvatar("acolhimento");
          avisoNaConversa(resposta.mensagem);
        } else {
          marcarRisco();
          falhaLocal();
        }
        return true;
      }
      const chat = lerChat(resposta.dados);
      if (!chat) {
        marcarRisco();
        falhaLocal();
        return true;
      }
      if (sinalDeRisco(chat)) marcarRisco();
      if (chat.assinatura) guardarTurno({ papel: "assistente", texto: chat.texto, assinatura: chat.assinatura });
      if (chat.restantes !== null) estado.sessao.restantes = Math.max(0, Math.floor(chat.restantes));
      definirAvatar(chat.estado);
      respostaDoChat(chat, false);
      if (podeConvidar(chat, estado.houveRisco || estado.riscoNaVisita)) mostrarCartao();
      return chat.tipo === "falha";
    }

    /* -- Botoes de tema: respostas da base, sem modelo. O token so segue em sessao de teste -- */

    const secaoTemas = no("section", "temas");
    secaoTemas.setAttribute("aria-labelledby", "titulo-temas");
    const tituloTemas = no("h2", "subtitulo", TEXTOS.temas_titulo);
    tituloTemas.id = "titulo-temas";
    tituloTemas.tabIndex = -1;
    const painel = no("div", "temas__painel");
    secaoTemas.appendChild(tituloTemas);
    secaoTemas.appendChild(painel);
    const canais = blocoCanais();
    blocos.push(secaoTemas);

    // A leitura de um tema aberto tem o botao Parar dentro do painel: quando o painel e trocado ou escondido, sem trocar
    // de tela, a leitura para junto, para nao seguir sem controle. A leitura de uma fala da conversa continua.
    function pararFalaDoPainel() {
      if (fala && fala.item.doPainel === true) pararFala();
    }

    function esvaziarPainel() {
      pararFalaDoPainel();
      ouviveis = ouviveis.filter(function (item) { return item.doPainel !== true; });
      esvaziar(painel);
    }

    /* -- Pre-lancamento: exemplo ficticio do diario e pre-inscricao. Blocos a parte, fora do cartao
          de convite. No primeiro sinal de risco saem da tela e nao voltam nesta visita -- */

    const ofertas = no("div", "ofertas");
    let desafioDaPreInscricao = null;
    blocos.push(ofertas);

    function retirarOfertas() {
      estado.riscoNaVisita = true;
      if (desafioDaPreInscricao) desafioDaPreInscricao.remover();
      desafioDaPreInscricao = null;
      if (!ofertas.firstChild) return;
      esvaziar(ofertas);
      // O que vinha abaixo sobe na tela: um toque a caminho dos blocos nao aciona outro controle.
      trocou();
    }

    // Bloco estatico: so texto de EXEMPLO_DIARIO, sem botao, sem campo e sem pedido.
    function blocoExemploDiario() {
      const dados = EXEMPLO_DIARIO;
      const secao = no("section", "exemplo-diario");
      secao.setAttribute("aria-labelledby", "titulo-exemplo-diario");
      const tituloExemplo = no("h2", "subtitulo", dados.marca);
      tituloExemplo.id = "titulo-exemplo-diario";
      const folha = no("div", "exemplo-diario__folha");
      folha.appendChild(no("h3", "exemplo-diario__titulo", dados.titulo));
      dados.registros.forEach(function (registro) {
        const item = no("div", "exemplo-diario__registro");
        item.appendChild(no("h4", "exemplo-diario__data", registro.data));
        const campos = no("dl", "exemplo-diario__campos");
        ["dor", "sangramento", "humor", "sono", "observacao"].forEach(function (chave) {
          const par = no("div", "exemplo-diario__par" + (chave === "observacao" ? " exemplo-diario__par--largo" : ""));
          par.appendChild(no("dt", null, dados.rotulos[chave]));
          par.appendChild(no("dd", null, String(registro[chave])));
          campos.appendChild(par);
        });
        item.appendChild(campos);
        folha.appendChild(item);
      });
      secao.appendChild(tituloExemplo);
      secao.appendChild(folha);
      secao.appendChild(no("p", "exemplo-diario__rodape", dados.marca));
      return secao;
    }

    function blocoPreInscricao() {
      const textos = TEXTOS.pre_inscricao;
      const doContato = TEXTOS.contato;
      const secao = no("section", "pre-inscricao");
      secao.setAttribute("aria-labelledby", "texto-pre-inscricao");
      const texto = no("p", "pre-inscricao__texto", textos.texto);
      texto.id = "texto-pre-inscricao";
      const formulario = no("form", "pre-inscricao__formulario");
      formulario.noValidate = true;
      // Como no formulario de contato: nada para o navegador guardar e sugerir a pessoa seguinte.
      const nome = campoDeTexto("campo-pre-nome", textos.nome_rotulo, "text", CONFIG.nome_max);
      nome.entrada.setAttribute("autocomplete", "off");
      nome.entrada.setAttribute("autocapitalize", "words");
      const email = campoDeTexto("campo-pre-email", doContato.email_rotulo, "email", CONFIG.email_max);
      email.entrada.setAttribute("inputmode", "email");
      email.entrada.setAttribute("autocomplete", "off");
      email.entrada.setAttribute("autocapitalize", "none");
      email.entrada.setAttribute("aria-describedby", "status-pre-inscricao");
      const grupo = no("fieldset", "grupo");
      grupo.appendChild(no("legend", null, textos.plano_legenda));
      const planos = textos.planos.map(function (plano) {
        const opcao = caixaDeMarcar("plano-" + plano.valor, plano.rotulo, "radio", "plano-de-interesse");
        opcao.entrada.value = plano.valor;
        grupo.appendChild(opcao.rotulo);
        return opcao.entrada;
      });
      const aviso = caixaDeMarcar("caixa-pre-aviso", textos.caixa_aviso);
      const maior = caixaDeMarcar("caixa-pre-maior", doContato.caixa_maior);
      const caixaDesafio = no("div", "desafio");
      const status = linhaDeStatus("status-pre-inscricao");
      const botao = no("button", "btn", doContato.botao);
      botao.type = "submit";
      const mensagens = {
        falta_email: doContato.erros.falta_email,
        email_invalido: doContato.erros.email_invalido,
        falta_plano: TEXTOS.marcacao.falta_motivo,
        falta_aviso: textos.falta_aviso,
        falta_maior: doContato.erros.falta_maior
      };

      // Desafio proprio deste formulario: a ficha da sessao e a do cartao nao sao reaproveitadas.
      const desafio = criarDesafio(caixaDesafio);
      desafioDaPreInscricao = desafio;
      limpezas.push(function () { desafio.remover(); });
      let situacao = "parado";

      function travar(travado) {
        [nome.entrada, email.entrada, aviso.entrada, maior.entrada].concat(planos).forEach(function (controle) {
          controle.disabled = travado;
        });
        travarBotao(botao, travado);
      }

      formulario.addEventListener("submit", function (evento) {
        evento.preventDefault();
        if (situacao === "enviando" || situacao === "enviado") return;
        const escolhido = planos.filter(function (entrada) { return entrada.checked === true; })[0];
        const campos = {
          nome: valorDe(nome.entrada),
          email: valorDe(email.entrada),
          plano: escolhido ? escolhido.value : "",
          aviso: aviso.entrada.checked === true,
          maior_de_18: maior.entrada.checked === true
        };
        const erro = validarPreInscricao(campos, { email_max: CONFIG.email_max, planos: textos.planos });
        if (erro) {
          status.textContent = mensagens[erro];
          if (erro === "falta_plano") planos[0].focus();
          else if (erro === "falta_aviso") aviso.entrada.focus();
          else if (erro === "falta_maior") maior.entrada.focus();
          else email.entrada.focus();
          return;
        }
        situacao = "enviando";
        travar(true);
        status.textContent = doContato.enviando;
        const serie = estado.serie;
        desafio.pedirFicha().then(function (ficha) {
          // Sem token de sessao e sem nada da conversa: so os campos deste formulario.
          return pedir("/api/contatos", {
            corpo: montarPreInscricao({
              nome: campos.nome,
              nome_max: CONFIG.nome_max,
              email: campos.email,
              plano: campos.plano,
              aviso: campos.aviso,
              maior_de_18: campos.maior_de_18,
              versao_textos: TEXTOS.versao,
              turnstile: ficha
            })
          });
        }).then(null, function () {
          return lerRespostaApi(0, null);
        }).then(function (resposta) {
          // Bloco retirado por sinal de risco, ou tela trocada: a resposta nao tem mais onde aparecer.
          if (serie !== estado.serie || desafioDaPreInscricao !== desafio) return;
          if (resposta.ok) {
            situacao = "enviado";
            desafio.remover();
            desafioDaPreInscricao = null;
            secao.removeChild(formulario);
            const sucesso = no("p", null, doContato.sucesso);
            sucesso.tabIndex = -1;
            secao.appendChild(sucesso);
            trocou();
            sucesso.focus();
          } else {
            situacao = "falhou";
            travar(false);
            botao.textContent = doContato.tentar;
            status.textContent = resposta.mensagem || doContato.falha;
          }
        });
      });

      formulario.appendChild(nome.campo);
      formulario.appendChild(email.campo);
      formulario.appendChild(grupo);
      formulario.appendChild(aviso.rotulo);
      formulario.appendChild(maior.rotulo);
      formulario.appendChild(caixaDesafio);
      formulario.appendChild(status);
      formulario.appendChild(botao);
      secao.appendChild(texto);
      secao.appendChild(formulario);
      return secao;
    }

    if (!estado.riscoNaVisita) {
      if (CONFIG.exemplo_diario === true) ofertas.appendChild(blocoExemploDiario());
      if (CONFIG.pre_inscricao === true && estado.saude.coleta === true) ofertas.appendChild(blocoPreInscricao());
    }

    /* -- Encerrar: apaga a conversa da tela e da memoria, para a proxima pessoa no mesmo aparelho -- */

    const encerramento = no("div", "encerrar");
    function botaoDeEncerrar() {
      esvaziar(encerramento);
      const botao = no("button", "btn btn--contorno", TEXTOS.encerrar.botao);
      botao.type = "button";
      botao.addEventListener("click", function () {
        esvaziar(encerramento);
        const pergunta = no("p", "encerrar__pergunta", TEXTOS.encerrar.pergunta);
        pergunta.tabIndex = -1;
        const sim = no("button", "btn", TEXTOS.encerrar.sim);
        sim.type = "button";
        sim.addEventListener("click", function () {
          desligarLeitura();
          estado.rascunho = "";
          estado.riscoNaVisita = false;
          estado.acolhida = acolhidaVazia();
          // O cadastro do gratuito era da pessoa que encerrou: sai da memória da página.
          estado.cadastro = null;
          avisarV1("encerrar");
          telaAceite(null, true);
        });
        const nao = no("button", "btn btn--contorno", TEXTOS.encerrar.nao);
        nao.type = "button";
        nao.addEventListener("click", function () {
          const devolta = botaoDeEncerrar();
          trocou();
          devolta.focus();
        });
        encerramento.appendChild(pergunta);
        encerramento.appendChild(sim);
        encerramento.appendChild(nao);
        trocou();
        pergunta.focus();
      });
      encerramento.appendChild(botao);
      return botao;
    }
    botaoDeEncerrar();
    blocos.push(encerramento);
    blocos.push(canais.secao);

    // Cada tema mostra o titulo e a chamada.
    function painelDeTemas(temas, focar) {
      esvaziarPainel();
      if (temas.length === 0) {
        painel.appendChild(no("p", "dica", TEXTOS.temas_vazio));
        return;
      }
      temas.forEach(function (tema) {
        const botao = no("button", "opcao opcao--tema");
        botao.type = "button";
        botao.appendChild(no("span", "opcao__texto", tema.titulo));
        if (tema.chamada) botao.appendChild(no("span", "opcao__chamada", tema.chamada));
        botao.addEventListener("click", function () { painelDoTema(tema, temas); });
        painel.appendChild(botao);
      });
      if (focar) {
        trocou();
        tituloTemas.focus();
      }
    }

    // Tema aberto: a sintese em paragrafos, quando procurar atendimento, o que levar a consulta e as duvidas do tema.
    // Tudo literal, como veio de /api/guiado; nenhum enunciado de mito, rotulo de classificacao ou identificador.
    function painelDoTema(tema, temas) {
      esvaziarPainel();
      const nome = no("h3", "temas__nome", tema.titulo);
      nome.tabIndex = -1;
      painel.appendChild(nome);
      const sintese = no("div", "tema__sintese");
      tema.paragrafos.forEach(function (paragrafo) { sintese.appendChild(no("p", null, paragrafo)); });
      painel.appendChild(sintese);
      let falado = tema.paragrafos.join("\n\n");
      if (tema.quando_procurar) {
        painel.appendChild(no("h4", "temas__subtitulo", TEXTOS.quando_procurar));
        painel.appendChild(no("p", null, tema.quando_procurar));
        falado += "\n" + TEXTOS.quando_procurar + ": " + tema.quando_procurar;
      }
      if (tema.para_a_consulta.length > 0) {
        painel.appendChild(no("h4", "temas__subtitulo", TEXTOS.para_consulta));
        const lista = no("ul", "tema__lista");
        tema.para_a_consulta.forEach(function (pergunta) { lista.appendChild(no("li", null, pergunta)); });
        painel.appendChild(lista);
        falado += "\n" + TEXTOS.para_consulta + ": " + tema.para_a_consulta.join(" ");
      }
      const acoes = no("div", "tema__acoes");
      painel.appendChild(acoes);
      registrarOuvivel(acoes, falado).doPainel = true;
      if (tema.duvidas.length > 0) {
        const duvidas = no("div", "tema__duvidas");
        tema.duvidas.forEach(function (duvida) {
          const botao = no("button", "opcao opcao--duvida");
          botao.type = "button";
          botao.appendChild(no("span", "opcao__texto", duvida.pergunta));
          botao.addEventListener("click", function () { respostaDaDuvida(duvida); });
          duvidas.appendChild(botao);
        });
        painel.appendChild(duvidas);
      }
      const voltar = no("button", "btn btn--contorno", TEXTOS.voltar_temas);
      voltar.type = "button";
      voltar.addEventListener("click", function () { painelDeTemas(temas, true); });
      painel.appendChild(voltar);
      trocou();
      nome.focus();
    }

    // So o pedido de temas mais recente vale: se a sessao de teste abrir com um pedido sem token
    // a caminho, a resposta dele nao desfaz os botoes.
    let pedidoDeTemas = 0;
    let canaisNaTela = false;

    // A acolhida so vem com sessao aberta e texto livre (as respostas servem ao pedido de conversa), uma vez por
    // conversa aceita, e nunca depois de o campo de escrita ja estar na tela.
    function podeComecarAcolhida() {
      return Boolean(acolhidaRecebida) && !estado.acolhida.feita && !emAcolhida && !escrita &&
        Boolean(sessao) && estado.saude.texto_livre === true;
    }

    // Sem acolhida nesta tela: o aviso de gravacao de sempre, no lugar em que ele ia aparecer.
    function resolverAviso() {
      if (avisoPendente === "topo") avisoDeGravacaoNoTopo();
      else if (avisoPendente === "conversa") avisoNaConversa(TEXTOS.aviso_teste);
      avisoPendente = null;
    }

    // Com a sessao aberta e a acolhida por fazer, o campo de escrita espera /api/guiado so ate CONFIG.espera_acolhida_ms.
    // Com a rede lenta, a pessoa escreve logo (inclusive um pedido de ajuda), e a acolhida, que viria antes do campo,
    // fica de fora desta tela: a resposta que chegar depois so traz os temas e os canais.
    function esperarAcolhida() {
      if (prazoDaAcolhida !== null) return;
      prazoDaAcolhida = setTimeout(function () {
        prazoDaAcolhida = null;
        if (escrita || emAcolhida || !guiadoPendente) return;
        resolverAviso();
        liberarEscrita();
      }, CONFIG.espera_acolhida_ms);
    }

    function pararPrazoDaAcolhida() {
      if (prazoDaAcolhida === null) return;
      clearTimeout(prazoDaAcolhida);
      prazoDaAcolhida = null;
    }

    // Sessao aberta aqui sem novo pedido de temas: o que ja chegou decide entre a acolhida e o campo.
    function seguirSemPedido() {
      if (podeComecarAcolhida()) {
        comecarAcolhida();
        return;
      }
      resolverAviso();
      liberarEscrita();
    }

    // So mexe no painel de temas e nos canais; a conversa da tela fica como esta. Com a resposta, a acolhida (quando
    // cabe) ou os temas e o campo de escrita, que nunca depende dos temas.
    function carregarGuiado(focar) {
      const serie = estado.serie;
      pedidoDeTemas += 1;
      const pedido = pedidoDeTemas;
      guiadoPendente = true;
      if (!emAcolhida) {
        esvaziarPainel();
        painel.appendChild(no("p", "dica", TEXTOS.temas_carregando));
        if (focar === true) tituloTemas.focus();
      }
      pedir("/api/guiado", { token: tokenDoGuiado(estado.sessao) }).then(function (resposta) {
        if (serie !== estado.serie || pedido !== pedidoDeTemas) return;
        guiadoPendente = false;
        pararPrazoDaAcolhida();
        const guiado = resposta.ok ? lerGuiado(resposta.dados) : null;
        if (guiado) {
          temasRecebidos = guiado.temas;
          acolhidaRecebida = guiado.acolhida;
          canais.preencher(guiado.canais);
          estado.canais = guiado.canais;
          canaisNaTela = true;
          // Acolhida em curso: os temas entram quando ela terminar.
          if (emAcolhida) return;
          if (podeComecarAcolhida()) {
            comecarAcolhida();
            return;
          }
          painelDeTemas(guiado.temas, false);
        } else if (!emAcolhida) {
          // API fora do ar: so a mensagem fixa de falha e a frase de emergencia.
          // Canais ja mostrados nesta tela ficam: a falha ao refazer os temas nao os apaga.
          esvaziarPainel();
          painel.appendChild(no("p", "aviso", resposta.mensagem || TEXTOS.falha));
          const tentar = no("button", "btn btn--contorno", TEXTOS.tentar);
          tentar.type = "button";
          tentar.addEventListener("click", function () { carregarGuiado(true); });
          painel.appendChild(tentar);
          if (!canaisNaTela) {
            estado.canais = [];
            canais.preencher([]);
          }
        }
        if (emAcolhida) return;
        resolverAviso();
        liberarEscrita();
      });
    }

    mostrar(blocos, titulo, true);
    estado.aoSair = function () {
      encerrarContato();
      limpezas.forEach(function (limpar) { limpar(); });
    };
    carregarGuiado();
  }

  definirAvatar("acolhimento");
  if (apiAtiva(CONFIG)) telaCarregando(false);
  else telaAceite(null, false);
})();
/* ==== PAGINA:FIM ==== */
</script>
</body>
</html>
