<!doctype html>
<html lang="pt-BR" data-cara="v1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- remover quando o conteúdo for assinado -->
<meta name="robots" content="noindex">
<!-- ==== CABECA:INICIO ==== -->
<title>Maria FlorIA — assistente virtual da EndoAfetos</title>
<meta name="theme-color" content="#b3427a">
<!-- ==== CABECA:FIM ==== -->
<link rel="icon" type="image/png" href="../assets/logo.png">
<style>
/* Paleta e tipografia do site EndoAfetos, sem carregar fontes de fora */
:root {
  /* ==== CORES:INICIO ==== */
  --cream: #f8f4f2;
  --cream-2: #efe8ec;
  --surface: #ffffff;
  --rose: #b3427a;
  --rose-dark: #8c2f5f;
  --rose-mist: #f9eef3;
  --gold-soft: #e7e0f6;
  --lavender: #8a62a3;
  --lavender-soft: #e4dbef;
  --ink: #494f83;
  --ink-soft: #6c6b88;
  --line: #e6dde3;
  /* ==== CORES:FIM ==== */
  /* ==== FONTES:INICIO ==== */
  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  /* ==== FONTES:FIM ==== */
  --radius: 20px;
  --radius-sm: 12px;
  --shadow: 0 18px 45px -22px rgba(73, 79, 131, 0.40);
  --shadow-sm: 0 8px 22px -14px rgba(73, 79, 131, 0.38);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--sans);
  font-size: 1.0625rem;
  line-height: 1.6;
  color: var(--ink);
  word-wrap: break-word;
  overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(1200px 600px at 50% -10%, var(--gold-soft) 0%, transparent 55%),
    linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
}
img { max-width: 100%; }
p { margin: 0 0 1em; }
/* O Safari anterior ao 15.4 não conhece :focus-visible: descarta a segunda regra e fica com o contorno da primeira */
:focus { outline: 3px solid var(--rose-dark); outline-offset: 3px; }
:focus:not(:focus-visible) { outline: none; }
main:focus, [tabindex="-1"]:focus { outline: none; }
button, a, label, input, textarea { touch-action: manipulation; }

.pular {
  position: absolute; left: 1rem; top: -5rem; z-index: 10;
  display: inline-flex; align-items: center; min-height: 44px;
  padding: .6rem 1rem;
  background: var(--surface); color: var(--rose-dark);
  font-weight: 700;
  border: 2px solid var(--rose-dark); border-radius: var(--radius-sm);
}
.pular:focus { top: 1rem; }

/* Espaço por margem, não por gap em flex: o Safari do iOS anterior ao 14.5 ignora o gap */
.topo { background: var(--cream); border-bottom: 1px solid var(--line); }
/* O topo só acompanha a rolagem onde a página sabe descontar a altura dele ao rolar até uma
   resposta (iOS 14.5 em diante). Nos mais antigos fica parado e nada é encoberto. */
@supports (scroll-margin-top: 1px) {
  html { scroll-padding-top: 6rem; }
  .topo { position: sticky; top: 0; z-index: 5; }
}
.topo__dentro { display: flex; align-items: center; max-width: 640px; margin: 0 auto; padding: .65rem 1rem; }
.topo__marca { margin: 0; line-height: 1.25; }
.topo__nome, .topo__sub { display: block; }
.topo__nome { font-family: var(--serif); font-size: 1.4rem; font-weight: 600; color: var(--ink); }
.topo__nome em { font-style: normal; color: var(--rose-dark); }
.topo__sub { font-size: .9rem; color: var(--ink); }
/* Texto so para o leitor de tela (a forma falada do nome): fora da vista, mas lido. */
.so-leitor { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* Avatar: a borboleta do logotipo. Cada estado muda o traço e o halo, não só a cor. */
.avatar {
  flex: none;
  width: 56px;
  height: 56px;
  margin-right: .85rem;
  padding: 7px;
  object-fit: contain;
  background: var(--surface);
  border: 3px solid var(--rose);
  border-radius: 50%;
  box-shadow: 0 0 0 4px var(--rose-mist);
  transition: border-color .3s ease, box-shadow .3s ease;
}
.avatar[data-estado="acolhimento"] { border-color: var(--rose); border-style: solid; box-shadow: 0 0 0 4px var(--rose-mist); }
.avatar[data-estado="escuta"] {
  border-color: var(--lavender);
  border-style: dashed;
  box-shadow: 0 0 0 5px var(--lavender-soft);
  animation: avatar-escuta 1.6s ease-in-out infinite;
}
.avatar[data-estado="informacao"] { border-color: var(--ink); border-style: dotted; box-shadow: 0 0 0 4px var(--gold-soft); }
.avatar[data-estado="orientacao"] { border-color: var(--rose-dark); border-style: double; border-width: 5px; box-shadow: 0 0 0 4px var(--cream-2); }
@keyframes avatar-escuta {
  0%, 100% { box-shadow: 0 0 0 2px var(--lavender-soft); }
  50% { box-shadow: 0 0 0 9px var(--lavender-soft); }
}

main { padding: 1rem 1rem 1.5rem; }
.cartao {
  max-width: 640px;
  margin: 0 auto;
  /* Valor de reserva antes de cada clamp(): o iOS anterior ao 13.4 descarta a declaração com clamp */
  padding: 1.15rem;
  padding: clamp(1.15rem, 5vw, 2.25rem);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

.titulo {
  margin: 0 0 .6em;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 1.5rem;
  font-size: clamp(1.5rem, 6vw, 2.1rem);
  line-height: 1.2;
  color: var(--ink);
}
.subtitulo, .temas__nome, .cartao-convite__titulo {
  margin: 0 0 .5rem;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 1.25rem;
  line-height: 1.25;
  color: var(--ink);
}
.temas__nome { font-size: 1.1rem; font-weight: 600; color: var(--rose-dark); }

.aviso {
  margin: 1rem 0 1.25rem;
  padding: .85rem 1rem;
  border-left: 6px solid var(--rose);
  border-radius: var(--radius-sm);
  background: var(--rose-mist);
  font-weight: 600;
}
.dica { margin: .35rem 0 .75rem; font-size: .92rem; color: var(--ink-soft); }
.status { min-height: 1.6em; margin: .5rem 0; font-weight: 700; color: var(--rose-dark); }
.status:empty { min-height: 0; margin: 0; }

.campo { margin-bottom: 1.1rem; }
.campo label, .escrita__rotulo { display: block; margin-bottom: .35rem; font-weight: 700; }
.campo input, .campo textarea, .escrita__campo {
  display: block;
  width: 100%;
  min-height: 48px;
  padding: .7rem .9rem;
  font: inherit;
  /* 16 px ou mais: abaixo disso o iOS aproxima a tela ao focar o campo */
  font-size: 1.0625rem;
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--ink-soft);
  border-radius: var(--radius-sm);
}
.campo textarea, .escrita__campo { min-height: 6.5rem; resize: vertical; }
.contador { margin: .3rem 0 0; font-size: .88rem; color: var(--ink-soft); text-align: right; }

.caixa { display: flex; align-items: flex-start; min-height: 44px; padding: .55rem 0; cursor: pointer; }
.caixa input { flex: none; width: 24px; height: 24px; margin: .1rem .75rem 0 0; accent-color: var(--rose-dark); }
.grupo { margin: 0 0 .75rem; padding: 0; border: 0; min-width: 0; }
.grupo legend { padding: 0; margin-bottom: .25rem; font-weight: 700; }
.desafio { max-width: 100%; margin: .75rem 0; }
.desafio:empty { margin: 0; }

.btn {
  display: flex; align-items: center; justify-content: center;
  width: 100%;
  min-height: 48px;
  margin: 0 0 .65rem;
  padding: .8rem 1.5rem;
  font: inherit;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
  border: 2px solid transparent;
  border-radius: 999px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .2s ease, box-shadow .2s ease;
}
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.btn--contorno { color: var(--rose-dark); background: var(--surface); border-color: var(--rose-dark); box-shadow: none; }
.btn[aria-disabled="true"] { opacity: .65; cursor: default; transform: none; }

.btn-mini {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 44px; min-width: 44px;
  margin: 0 .5rem .35rem 0;
  padding: .4rem 1rem;
  font: inherit;
  font-size: .95rem;
  font-weight: 700;
  color: var(--rose-dark);
  background: var(--surface);
  border: 2px solid var(--rose-dark);
  border-radius: 999px;
  cursor: pointer;
}
.btn-mini[aria-pressed="true"] { color: #fff; background: var(--rose-dark); border-style: double; border-width: 4px; }

.intro { margin-bottom: 1rem; }
/* Regiões vivas (registro e espera) ficam sempre na página: vazias, só perdem a margem.
   Com display:none o leitor de tela não anuncia o primeiro texto que entra nelas. */
.registro { margin: 0 0 .5rem; }
.registro:empty { margin: 0; }
.msg {
  margin: 0 0 .85rem;
  padding: .8rem .95rem;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
}
.msg > :last-child { margin-bottom: 0; }
.msg__autor { margin: 0 0 .25rem; font-size: .8rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--rose-dark); }
.msg__texto, .msg__apoio { white-space: pre-wrap; word-break: break-word; }
.msg__texto { margin-bottom: .6em; }
.msg--pessoa { margin-left: 1.5rem; background: var(--lavender-soft); border-color: var(--lavender); }
.msg--pessoa .msg__autor { color: var(--ink); }
.msg--assistente { margin-right: 1.5rem; border-color: var(--rose); }
/* Mensagem de segurança: destaque sóbrio, pelo traço e não só pela cor */
.msg--seguranca { margin-right: 0; background: var(--cream); border: 3px solid var(--ink); border-left-width: 10px; }
.msg--limite, .msg--recusa, .msg--falha { border-style: dashed; border-color: var(--ink-soft); }
.msg--aviso { background: var(--cream); border-style: dashed; border-color: var(--ink-soft); font-weight: 600; }
.msg__apoio { margin-top: .75rem; padding-top: .75rem; border-top: 2px solid var(--ink-soft); font-weight: 700; }
/* Linha de apoio sozinha no balão (nome da acolhida com sinal ambíguo): sem o traço que a separa da resposta */
.msg__autor + .msg__apoio { margin-top: 0; padding-top: 0; border-top: 0; }
.msg__tecnico { margin: .5rem 0 0; font-family: Consolas, Menlo, monospace; font-size: .8rem; color: var(--ink-soft); }
.msg__acoes { display: flex; flex-wrap: wrap; margin-top: .65rem; }
.msg__acoes:empty { display: none; }
.saber-mais { margin-top: .6rem; border-top: 1px solid var(--line, #e3d6df); padding-top: .45rem; }
.saber-mais__titulo { cursor: pointer; font-weight: 600; color: var(--rose-dark); min-height: 44px; display: flex; align-items: center; }
.saber-mais__titulo:focus-visible { outline: 3px solid var(--rose-dark); outline-offset: 2px; }
.saber-mais__texto { margin: .4rem 0 0; }
.saber-mais__nota { margin: .5rem 0 0; font-size: .85rem; color: var(--ink-soft); }
.leitura { display: flex; flex-wrap: wrap; align-items: center; margin: .25rem 0 .75rem; }
.leitura[hidden] { display: none; }
.leitura__opcao { min-height: 44px; margin: 0 1rem .25rem 0; }
.leitura__dica { flex-basis: 100%; margin: 0; font-size: .85rem; color: var(--ink-soft); }
/* Acolhida: os controles ficam dentro do balão da pergunta e saem dele quando a pessoa responde */
.acolhida__controles { margin-top: .75rem; }
.acolhida__controles .campo { margin-bottom: .65rem; }
.acolhida__controles .btn { margin-bottom: .5rem; }

.espera { margin: 0 0 .85rem; font-weight: 700; color: var(--rose-dark); }
.espera:empty { margin: 0; }

.escrita, .reabrir { margin: 0 0 1.5rem; padding: 1rem 0 0; border-top: 1px solid var(--line); }
.escrita .dica, .reabrir .dica { margin-top: 0; font-size: 1rem; font-weight: 700; color: var(--ink); }
.encerrar { margin: 0 0 1.5rem; }
.encerrar__pergunta { margin-bottom: .6rem; font-weight: 700; }
.rascunho > :last-child { margin-bottom: 0; }

.temas { margin: 0 0 1.5rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.opcao {
  display: block;
  width: 100%;
  min-height: 56px;
  margin: 0 0 .7rem;
  padding: .8rem 1rem;
  font: inherit;
  text-align: left;
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--lavender);
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.opcao:hover { background: var(--lavender-soft); }
.opcao__texto, .opcao__chamada { display: block; }
.opcao--tema .opcao__texto { font-weight: 700; }
.opcao__chamada { margin-top: .25rem; font-size: .95rem; }

/* Tema aberto: síntese, quando procurar atendimento, perguntas para a consulta e as dúvidas */
.tema__sintese > :last-child { margin-bottom: 0; }
.temas__subtitulo { margin: 1.1rem 0 .35rem; font-size: 1rem; font-weight: 800; line-height: 1.3; color: var(--ink); }
.tema__lista { margin: 0 0 .75rem; padding-left: 1.25rem; }
.tema__lista li { margin-bottom: .35rem; }
.tema__acoes { display: flex; flex-wrap: wrap; margin: .5rem 0 0; }
.tema__acoes:empty { display: none; }
.tema__duvidas { margin-top: 1.1rem; }

.marcacao { margin-top: .75rem; }
.marcacao:empty { display: none; }
.marcacao__ok { font-weight: 700; }

/* Cartão de conversão: o padrão visual da tela final do quiz (conheça, ofertas, brinde) */
.cartao-convite {
  margin: 0 0 1rem;
  padding: 1rem 1.1rem;
  background: var(--surface);
  border: 2px solid var(--lavender);
  border-radius: var(--radius-sm);
}
/* As dicas do formulário de contato usam a cor principal: o cinza delas não chega ao AA sobre o lilás dos blocos */
.cartao-convite .dica { color: var(--ink); }
.usos-convite { font-weight: 700; color: var(--ink); }
.usos-convite:empty { margin: 0; }
.conversao__titulo {
  margin: 0 0 .6rem;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 1.4rem;
  line-height: 1.2;
  color: var(--ink);
}
.conversao__cuidado { font-weight: 700; }
.conversao__conheca { margin: 1.25rem 0; padding: 1rem 1rem 1.1rem; border-radius: var(--radius-sm); background: var(--rose-mist); }
.conversao__conheca h3, .conversao__presente h3 {
  margin: 0 0 .5rem;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 1.2rem;
  line-height: 1.25;
  color: var(--ink);
}
.conversao__conheca p { margin: 0 0 1rem; }
.conversao__ofertas { margin: 0 0 1.1rem; padding: 0; list-style: none; }
.conversao__oferta { margin: 0 0 .75rem; padding: .8rem .9rem; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--line); }
.conversao__oferta-titulo { display: block; font-weight: 800; color: var(--rose-dark); }
.conversao__oferta-texto { display: block; }
a.btn { text-decoration: none; }
.btn--conheca { text-transform: uppercase; letter-spacing: .03em; }
/* No botao em flex, o espaco no comeco do span da seta some: a distancia vem da margem */
.btn__seta { margin-left: .4em; }
.conversao__separador { height: 1px; margin: 1.25rem 0; border: 0; background: var(--line); }
.conversao__presente { margin: 0 0 1.25rem; padding: .95rem 1rem; border-radius: var(--radius-sm); background: var(--gold-soft); }
.conversao__presente p { margin: 0; }
.conversao__presente .conversao__destaque { margin-bottom: .25rem; font-weight: 800; }

/* Pré-lançamento: blocos à parte do cartão de convite */
.pre-inscricao, .exemplo-diario {
  margin: 0 0 1.5rem;
  padding: 1rem 1.1rem;
  background: var(--cream);
  border: 2px solid var(--lavender);
  border-radius: var(--radius-sm);
}
.pre-inscricao > :last-child { margin-bottom: 0; }
.pre-inscricao__texto { font-weight: 600; }
.exemplo-diario__folha {
  padding: .85rem .95rem;
  background: var(--surface);
  border: 2px dashed var(--ink-soft);
  border-radius: var(--radius-sm);
}
.exemplo-diario__titulo {
  margin: 0 0 .6rem;
  font-family: var(--serif);
  font-size: 1.1rem;
  font-weight: 600;
  line-height: 1.25;
  color: var(--rose-dark);
}
.exemplo-diario__registro { margin: 0 0 .7rem; padding-top: .6rem; border-top: 1px solid var(--line); }
.exemplo-diario__registro:last-child { margin-bottom: 0; }
.exemplo-diario__data { margin: 0 0 .2rem; font-size: 1rem; font-weight: 800; }
.exemplo-diario__campos { margin: 0; }
/* Espaço entre os pares por margem, sem gap */
.exemplo-diario__par { display: inline-block; margin: 0 1.25rem .1rem 0; }
.exemplo-diario__par--largo { display: block; margin-right: 0; }
.exemplo-diario__par dt, .exemplo-diario__par dd { display: inline; margin: 0; }
.exemplo-diario__par dt { font-weight: 800; }
.exemplo-diario__par dt::after { content: ": "; }
.exemplo-diario__rodape { margin: .75rem 0 0; font-size: .92rem; font-weight: 800; }

.canais {
  margin: 0;
  padding: 1rem 1.1rem;
  background: var(--cream);
  border: 2px solid var(--lavender);
  border-radius: var(--radius-sm);
}
.canais__emergencia { margin: 0 0 .5rem; font-weight: 800; }
/* Canais ilustrados como no quiz: lista vertical, ícone em SVG embutido (data:) separado do texto por margem */
.canais ul { margin: 0; padding: 0; list-style: none; }
.canais li { margin: 0 0 .5rem; }
.canais li:last-child { margin-bottom: 0; }
.canal { display: flex; align-items: center; min-height: 48px; color: var(--ink); text-decoration: none; }
.canal__icone {
  flex: none;
  width: 40px; height: 40px;
  margin-right: .75rem;
  border-radius: 50%;
  background-color: var(--lavender-soft);
  background-repeat: no-repeat;
  background-position: center;
  background-size: 22px 22px;
}
.canal__icone--cruz { background-image: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 24 24'%3E%3Cpath d='M9 3h6v6h6v6h-6v6H9v-6H3V9h6z' fill='%238c2f5f'/%3E%3C/svg%3E"); }
.canal__icone--escudo { background-image: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z' fill='none' stroke='%238c2f5f' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E"); }
.canal__icone--mulher { background-image: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='9' r='5' fill='none' stroke='%238c2f5f' stroke-width='2'/%3E%3Cpath d='M12 14v8M8.5 18.5h7' stroke='%238c2f5f' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"); }
.canal__icone--pessoas { background-image: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 24 24'%3E%3Ccircle cx='8' cy='8' r='3' fill='%238c2f5f'/%3E%3Ccircle cx='16.5' cy='9.5' r='2.5' fill='%238c2f5f'/%3E%3Cpath d='M2.5 20c0-3.6 2.5-6 5.5-6s5.5 2.4 5.5 6zM13.5 20c.3-2.9 1.6-5 3.5-5 2.3 0 4.5 2 4.5 5z' fill='%238c2f5f'/%3E%3C/svg%3E"); }
.canal__icone--conversa { background-image: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 24 24'%3E%3Cpath d='M4 4h16v11H9l-5 4z' fill='none' stroke='%238c2f5f' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M12 13s-3.5-2.1-3.5-4.2A1.9 1.9 0 0 1 12 8a1.9 1.9 0 0 1 3.5.8c0 2.1-3.5 4.2-3.5 4.2z' fill='%238c2f5f'/%3E%3C/svg%3E"); }
.canal__texto { display: block; }
.canal__rotulo { display: block; font-weight: 800; color: var(--rose-dark); text-decoration: underline; text-underline-offset: 3px; }
.canal__descricao { display: block; font-size: .92rem; color: var(--ink); }

.rodape { padding: 0 1rem 2rem; text-align: center; font-size: .92rem; color: var(--ink); }
.rodape p { margin: 0; }

@media (min-width: 520px) {
  .btn { display: inline-flex; width: auto; min-width: 13rem; margin-right: .6rem; }
}
/* Tela baixa (teclado aberto ou aparelho deitado): o topo deixa de acompanhar a rolagem */
@media (max-height: 420px) {
  .topo { position: static; }
}

/* Cara nova (v1) da página da assistente. Tudo aqui só vale com data-cara="v1" no <html>; na cara de hoje as peças
   da v1 ficam escondidas e nada muda. Movimento só em transform e opacity; mensagens sempre em cartão sólido; o céu
   fica atrás de tudo (z-index -1) e nunca leva texto. */
html:not([data-cara="v1"]) .v1-so { display: none !important; }

.v1-ceu { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: -1; pointer-events: none; overflow: hidden; }

.v1-ceu__brilho {
  position: absolute; top: -30%; left: -20%; width: 140%; height: 90%;

/* ---------- A borboleta ---------- */
.v1-bf { display: block; width: 100%; height: 100%; overflow: visible; transform-origin: 50% 60%; transition: transform .8s cubic-bezier(.3, .7, .3, 1); }
.v1-asa { transform-box: view-box; transform-origin: 60px 58px; transform: scaleX(var(--v1-abertura, .94)); transition: transform .9s cubic-bezier(.3, .7, .3, 1); }
.v1-asa-sup { fill: var(--bf-asa-sup); stroke: var(--bf-contorno); stroke-width: 2.6; stroke-linejoin: round; }
.v1-asa-sup-luz { fill: var(--bf-asa-sup-luz); }
.v1-asa-inf { fill: var(--bf-asa-inf); stroke: var(--bf-contorno); stroke-width: 2.6; stroke-linejoin: round; }
.v1-asa-inf-luz { fill: var(--bf-asa-inf-luz); }
.v1-pinta { fill: var(--bf-pinta); }
.v1-veio { fill: none; stroke: var(--bf-contorno); stroke-width: 2.2; stroke-linecap: round; }
.v1-antena { fill: none; stroke: var(--bf-contorno); stroke-width: 2; stroke-linecap: round; }
.v1-antena-ponta, .v1-tronco { fill: var(--bf-contorno); }
.v1-cabeca { fill: var(--bf-cabeca); stroke: var(--bf-contorno); stroke-width: 2.6; }
.v1-olhos-ponto { fill: var(--bf-olho); }
.v1-olhos-arco { display: none; fill: none; stroke: var(--bf-olho); stroke-width: 1.35; stroke-linecap: round; }
.v1-olhos { transform-box: view-box; transform-origin: 60px 38.6px; transition: transform .5s ease; }
/* Posturas: a diferença está na abertura das asas, na inclinação e nos olhos, não só na cor */
.v1-bf[data-postura="repouso"] { --v1-abertura: .88; }
.v1-bf[data-postura="acolhimento"] { --v1-abertura: 1; }
.v1-bf[data-postura="acolhimento"] .v1-olhos-ponto, .v1-bf[data-postura="despedida"] .v1-olhos-ponto { display: none; }
.v1-bf[data-postura="acolhimento"] .v1-olhos-arco, .v1-bf[data-postura="despedida"] .v1-olhos-arco { display: inline; }
.v1-bf[data-postura="escuta"] { --v1-abertura: .76; transform: rotate(-10deg); }
.v1-bf[data-postura="informacao"] { --v1-abertura: .96; transform: rotate(4deg); }
.v1-bf[data-postura="informacao"] .v1-olhos { transform: translate(1.4px, 1.8px); }
.v1-bf[data-postura="orientacao"] { --v1-abertura: 1.1; transform: rotate(10deg) translate3d(2px, -2px, 0); }
.v1-bf[data-postura="orientacao"] .v1-olhos { transform: translate(2px, 0); }
.v1-bf[data-postura="seguranca"] { --v1-abertura: .68; }
.v1-bf[data-postura="despedida"] { --v1-abertura: 1.1; transform: rotate(-7deg) translate3d(0, -2px, 0); }

.v1-bf.v1-bf--respira .v1-asa { animation: v1-respirar-asa 3.6s ease-in-out 1; }
.v1-bf.v1-bf--pisca .v1-olhos { animation: v1-piscar .16s ease-in-out 1; }
.v1-bf.v1-bf--inclina { transform: rotate(-6deg); }
.v1-bf.v1-bf--bate .v1-asa { animation: v1-bater .26s ease-in-out infinite alternate; }
.v1-bf.v1-bf--parte { animation: v1-partir 3.2s cubic-bezier(.4, .1, .7, .5) 1 both; }
.v1-bf.v1-bf--chega { animation: v1-chegar 3s cubic-bezier(.25, .8, .3, 1) 1 both; }
@keyframes v1-bater { from { transform: scaleX(1.02); } to { transform: scaleX(.28); } }
@keyframes v1-respirar-asa { 0%, 100% { transform: scaleX(var(--v1-abertura, .94)); } 50% { transform: scaleX(calc(var(--v1-abertura, .94) - .14)); } }
@keyframes v1-piscar { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.1); } }
@keyframes v1-chegar {
  0% { opacity: 0; transform: translate3d(-60vw, 70vh, 0) rotate(-24deg) scale(1.5); }
  15% { opacity: 1; }
  55% { transform: translate3d(-14vw, 22vh, 0) rotate(10deg) scale(1.2); }
  100% { opacity: 1; transform: translate3d(0, 0, 0) rotate(0) scale(1); }
}
@keyframes v1-partir {
  0% { opacity: 1; transform: translate3d(0, 0, 0) rotate(0) scale(1); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translate3d(70vw, -18vh, 0) rotate(18deg) scale(.7); }

/* ---------- Pétalas e vento: só nas trocas de cena, menos de 5 segundos ---------- */

const ESTADOS_DO_AVATAR = ["acolhimento", "escuta", "informacao", "orientacao"];
const MODOS = ["fechado", "demonstracao", "publico"];

// Acolhida (contrato da API, versao 1): valores fechados, iguais aos do Worker.
const CHAVES_DA_ABERTURA = ["sim", "suspeitas", "duvidas", "outra_pessoa", "sem_resposta"];
const DIAGNOSTICOS = ["sim", "nao", "nao_informado"];
const MOTIVOS = ["suspeitas", "duvidas", "outra_pessoa"];

// Voz feminina de preferencia. O navegador nao informa o genero da voz: a pagina le pelo nome,
// em minusculas e sem acento, palavra por palavra.
const VOZES = {
  femininas: ["luciana", "maria", "francisca", "thalita", "brenda", "elza", "giovanna", "leila", "leticia", "manuela", "yara"],
  masculinas: ["daniel", "antonio", "felipe", "fabio", "donato", "humberto", "julio", "nicolau", "valerio"],
  // A voz remota do Chrome no computador: feminina, sem nome proprio.
  feminina_pelo_nome: "google portugues do brasil"
};
// Ordem de escolha: no aparelho (localService true) antes de remota, porque na voz remota o texto vai ao
// servidor do fornecedor da voz. A masculina fica por ultimo.
const ORDEM_DAS_VOZES = [
  ["feminina", true], ["indefinida", true], ["feminina", false], ["indefinida", false], ["masculina", true], ["masculina", false]
];
/* ==== DADOS:FIM ==== */

/* ==== PURAS:INICIO ==== */
// Uma passada so: o que entra no lugar de {chave} nao e lido de novo.
function preencher(modelo, valores) {
  return String(modelo).replace(/\{(\w+)\}/g, function (trecho, chave) {
    return Object.prototype.hasOwnProperty.call(valores, chave) ? String(valores[chave]) : trecho;
  });
}

// Dentro da guarda, o toque ainda pode ser o segundo de um toque duplo na tela anterior.
function dentroDaGuarda(agora, mudouEm, guarda) {
  const passou = agora - mudouEm;
  return passou >= 0 && passou < guarda;
}

function textoOuNulo(valor) {
  return typeof valor === "string" && valor.trim() !== "" ? valor : null;
}

function apiAtiva(config) {
  return /^https:\/\/./.test(String(config.api == null ? "" : config.api));
}

function enderecoApi(config, caminho) {
  return String(config.api).replace(/\/+$/, "") + caminho;
}

// Toda resposta da API vira { ok: true, dados } ou { ok: false, erro, mensagem }.
function lerRespostaApi(status, corpo) {
  const valido = Boolean(corpo) && typeof corpo === "object";
  if (valido && corpo.ok === true) return { ok: true, status: status, dados: corpo };
  const lida = {
    ok: false,
    status: status,
    erro: valido && typeof corpo.erro === "string" ? corpo.erro : "falha",
    mensagem: valido ? textoOuNulo(corpo.mensagem) : null
  };
  // Cadastro do gratuito (24/11): o campo recusado e, com sinal de risco no nome, a mensagem de seguranca.
  if (valido && typeof corpo.campo === "string") lida.campo = corpo.campo;
  if (valido && textoOuNulo(corpo.seguranca)) lida.seguranca = corpo.seguranca;
  return lida;
}

function lerSaude(dados) {
  if (!dados || MODOS.indexOf(dados.modo) === -1) return null;
  const saude = { modo: dados.modo, texto_livre: dados.texto_livre === true, coleta: dados.coleta === true };
  // Gratuito com cadastro: so aparece quando o servidor o liga (CADASTRO_GRATUITO).
  if (dados.cadastro_gratuito === true) saude.cadastro_gratuito = true;
  return saude;
}

// Instante em que a sessao vence, pelo relogio deste aparelho. Devolve null quando expira_em
// nao serve (ausente, ja passado ou longe demais): ai so o 401 do Worker avisa do vencimento.
function vencimentoDaSessao(expiraEm, agoraMs, validadeMaxMs) {
  const fim = typeof expiraEm === "string" ? Date.parse(expiraEm) : NaN;
  const falta = fim - agoraMs;
  return isFinite(falta) && falta > 0 && falta <= validadeMaxMs ? fim : null;
}

function sessaoVenceu(venceEm, agoraMs) {
  return typeof venceEm === "number" && agoraMs >= venceEm;
}

function lerSessao(dados, agoraMs, validadeMaxMs) {
  if (!dados || !textoOuNulo(dados.token)) return null;
  if (dados.tipo !== "livre" && dados.tipo !== "teste") return null;
  const numero = function (valor) {
    return typeof valor === "number" && isFinite(valor) && valor >= 0 ? Math.floor(valor) : null;
  };
  return {
    token: dados.token,
    tipo: dados.tipo,
    limite: numero(dados.limite),
    restantes: numero(dados.restantes),
    vence_em: vencimentoDaSessao(dados.expira_em, agoraMs, validadeMaxMs),
    usos: dados.tipo === "teste" ? lerUsosDoConvite(dados.convite_usos) : null,
    // Achado A12: a linha tecnica (tipo e itens da base) so para os convites da equipe.
    tecnico: dados.tipo === "teste" && dados.tecnico === true
  };
}

// No modo fechado so quem informa o codigo pede sessao: sem codigo, ficam os botoes de tema,
// que nao dependem dela. Nos outros modos, a sessao e pedida quando ha texto livre a abrir.
function precisaDeSessao(saude, codigo) {
  if (saude.modo === "fechado") return codigo !== "";
  return saude.texto_livre === true;
}

// No modo fechado, o Worker so entrega os itens em curadoria de /api/guiado a quem manda o token
// de uma sessao de teste. Sem sessao de teste, o pedido segue sem token.
function tokenDoGuiado(sessao) {
  return Boolean(sessao) && sessao.tipo === "teste" && textoOuNulo(sessao.token) ? sessao.token : null;
}

function limparCodigo(texto, maximo) {
  return String(texto == null ? "" : texto).trim().slice(0, maximo);
}

function montarSessao(dados) {
  const convite = limparCodigo(dados.convite, dados.convite_max);
  const corpo = {
    turnstile: String(dados.turnstile),
    aceite_versao: dados.aceite_versao,
    convite: convite === "" ? null : convite
  };
  // Gratuito com cadastro (24/11): so quando o servidor pede e sem codigo de convite.
  if (dados.cadastro && corpo.convite === null) corpo.cadastro = dados.cadastro;
  return corpo;
}

// Cadastro do gratuito: nome completo (com sobrenome), e-mail e a caixa de 18 anos. Devolve o corpo ou o campo errado.
function lerCadastroDoGratuito(nome, email, maior, novidades) {
  const nomeLimpo = String(nome == null ? "" : nome).replace(/\s+/g, " ").trim();
  const emailLimpo = String(email == null ? "" : email).trim();
  if (!/^\S+(?: \S+)+$/.test(nomeLimpo) || nomeLimpo.length > 120 || /\d/.test(nomeLimpo)) return { ok: false, campo: "nome_completo" };
  if (!emailValido(emailLimpo, 254)) return { ok: false, campo: "email" };
  if (maior !== true) return { ok: false, campo: "maior_de_18" };
  return { ok: true, cadastro: { nome_completo: nomeLimpo, email: emailLimpo, maior_de_18: true, novidades: novidades === true } };
}

// Texto que pode ir para a tela: preenchido e sem identificador da base. O Worker ja garante; a pagina confere de novo.
function textoPublico(valor) {
  return typeof valor === "string" && valor.trim() !== "" && valor.indexOf("ENDO-") === -1 ? valor : null;
}

function textosPublicos(lista) {
  return (Array.isArray(lista) ? lista : []).filter(function (texto) { return textoPublico(texto) !== null; });
}

// A sintese vem inteira, com as quebras de paragrafo: cada bloco separado por linha em branco vira um paragrafo.
function paragrafosDe(texto) {
  return String(texto == null ? "" : texto).split(/\n[ \t]*\n/).map(function (paragrafo) {
    return paragrafo.trim();
  }).filter(function (paragrafo) { return paragrafo !== ""; });
}

// So as opcoes de id conhecido, sem repetir, na ordem recebida.
function opcoesValidas(lista, permitidas) {
  const vistas = [];
  const saida = [];
  (Array.isArray(lista) ? lista : []).forEach(function (opcao) {
    if (!opcao || permitidas.indexOf(opcao.id) === -1 || vistas.indexOf(opcao.id) !== -1) return;
    const rotulo = textoPublico(opcao.rotulo);
    if (!rotulo) return;
    vistas.push(opcao.id);
    saida.push({ id: opcao.id, rotulo: rotulo });
  });
  return saida;
}

// As cinco aberturas; sem nome, nenhuma pode trazer marcador (trocar {nome} por vazio quebra a frase).
function aberturasValidas(aberturas, semNome) {
  if (!aberturas || typeof aberturas !== "object") return null;
  const saida = {};
  for (let i = 0; i < CHAVES_DA_ABERTURA.length; i++) {
    const texto = textoPublico(aberturas[CHAVES_DA_ABERTURA[i]]);
    if (!texto || (semNome && /[{}]/.test(texto))) return null;
    saida[CHAVES_DA_ABERTURA[i]] = texto;
  }
  return saida;
}

// Acolhida de /api/guiado. Fora do contrato vira null, e a pagina vai direto a conversa, como sem acolhida.
function lerAcolhida(dados) {
  if (!dados || typeof dados !== "object") return null;
  const campos = ["apresentacao", "pergunta_nome", "rotulo_pular", "pergunta_diagnostico", "rotulo_sem_resposta",
    "pergunta_motivo", "aviso_sem_registro", "aviso_teste"];
  const acolhida = {};
  for (let i = 0; i < campos.length; i++) {
    const texto = textoPublico(dados[campos[i]]);
    if (!texto) return null;
    acolhida[campos[i]] = texto;
  }
  acolhida.opcoes_diagnostico = opcoesValidas(dados.opcoes_diagnostico, ["sim", "nao"]);
  acolhida.opcoes_motivo = opcoesValidas(dados.opcoes_motivo, MOTIVOS);
  acolhida.abertura = aberturasValidas(dados.abertura, false);
  acolhida.abertura_sem_nome = aberturasValidas(dados.abertura_sem_nome, true);
  if (acolhida.opcoes_diagnostico.length !== 2 || acolhida.opcoes_motivo.length === 0) return null;
  if (!acolhida.abertura || !acolhida.abertura_sem_nome) return null;
  return acolhida;
}

// GET /api/guiado, versao 1. Tema sem titulo ou sem sintese fica de fora; duvida sem resposta servivel tambem.
// O identificador da duvida ("B-3") fica guardado, mas nunca vai para a tela.
function lerGuiado(dados) {
  if (!dados || !Array.isArray(dados.temas)) return null;
  const temas = [];
  dados.temas.forEach(function (tema) {
    if (!tema) return;
    const titulo = textoPublico(tema.titulo);
    const sintese = textoPublico(tema.sintese);
    if (!titulo || !sintese) return;
    const duvidas = [];
    (Array.isArray(tema.duvidas) ? tema.duvidas : []).forEach(function (duvida) {
      if (!duvida || !textoPublico(duvida.pergunta)) return;
      const respostas = textosPublicos(duvida.respostas);
      if (respostas.length > 0) duvidas.push({ id: textoOuNulo(duvida.id), pergunta: duvida.pergunta, respostas: respostas });
    });
    temas.push({
      id: textoOuNulo(tema.id),
      titulo: titulo,
      chamada: textoPublico(tema.chamada),
      paragrafos: paragrafosDe(sintese),
      quando_procurar: textoPublico(tema.quando_procurar),
      para_a_consulta: textosPublicos(tema.para_a_consulta),
      duvidas: duvidas
    });
  });
  const canais = [];
  (Array.isArray(dados.canais) ? dados.canais : []).forEach(function (canal) {
    if (!canal || typeof canal.numero !== "string" || telefoneDoCanal(canal.numero) === "") return;
    canais.push({ numero: canal.numero.trim(), nome: textoOuNulo(canal.nome) });
  });
  return { acolhida: lerAcolhida(dados.acolhida), temas: temas, canais: canais };
}

// Mesma regra do Worker (limparComoChamar, em contexto.mjs): aparado, espacos simples, ate 30 caracteres, so letras
// latinas (com acento), espaco, hifen e apostrofo, com pelo menos uma letra. Qualquer outra coisa vira null.
const NOME_DE_CHAMAR = (function () {
  try {
    return {
      permitido: new RegExp("^(?:(?=\\p{L})\\p{Script=Latin}|[ '\\u2019-])+$", "u"),
      letra: new RegExp("\\p{L}", "u")
    };
  } catch (falha) {
    // Navegador sem classes Unicode em expressao regular: so as letras latinas de uso comum.
    return {
      permitido: /^[A-Za-zªºÀ-ÖØ-öø-ɏḀ-ỿ '’-]+$/,
      letra: /[A-Za-zªºÀ-ÖØ-öø-ɏḀ-ỿ]/
    };
  }
})();

function limparComoChamar(valor, maximo) {
  if (typeof valor !== "string" || valor.length > 200) return null;
  const composto = typeof valor.normalize === "function" ? valor.normalize("NFC") : valor;
  const nome = composto.trim().replace(/ {2,}/g, " ");
  if (nome === "" || Array.from(nome).length > maximo) return null;
  return NOME_DE_CHAMAR.permitido.test(nome) && NOME_DE_CHAMAR.letra.test(nome) ? nome : null;
}

// O que vai no campo "contexto" de todo POST /api/chat, e de nenhum outro pedido. Mesma limpeza do Worker
// (limparContexto): o motivo so vale quando o diagnostico e "nao".
function montarContexto(respostas, maximo) {
  const dados = respostas || {};
  const diagnostico = DIAGNOSTICOS.indexOf(dados.diagnostico) !== -1 ? dados.diagnostico : null;
  const motivo = diagnostico === "nao" && MOTIVOS.indexOf(dados.motivo) !== -1 ? dados.motivo : null;
  return { como_chamar: limparComoChamar(dados.como_chamar, maximo), diagnostico: diagnostico, motivo: motivo };
}

// "Prefiro nao responder", no diagnostico ou no motivo, leva a abertura sem_resposta.
function chaveDaAbertura(respostas) {
  if (respostas.diagnostico === "sim") return "sim";
  if (respostas.diagnostico === "nao" && MOTIVOS.indexOf(respostas.motivo) !== -1) return respostas.motivo;
  return "sem_resposta";
}

// Com nome, {nome} da abertura vira o nome; sem nome, a abertura pronta sem ele.
function textoDaAbertura(acolhida, respostas) {
  const chave = chaveDaAbertura(respostas);
  return respostas.como_chamar
    ? preencher(acolhida.abertura[chave], { nome: respostas.como_chamar })
    : acolhida.abertura_sem_nome[chave];
}

// Um aviso so: o de gravacao na sessao de teste, o de nada guardado nas outras.
function avisoDaAcolhida(acolhida, tipoDaSessao) {
  return tipoDaSessao === "teste" ? acolhida.aviso_teste : acolhida.aviso_sem_registro;
}

// POST /api/acolhida/nome. O nome so vale depois da regra de risco do Worker:
// - "nome" sem linha de apoio: o nome limpo que ele devolveu (limpo de novo aqui) ou null;
// - "nome" com linha de apoio (sinal ambiguo): sem nome, a linha para mostrar e a marca para o historico;
// - "seguranca" (sinal explicito): sem nome, a mensagem de seguranca e a marca para o historico.
// A marca e a fala da assistente assinada pelo Worker com a marca de risco da sessao: texto_marca (ambiguo) ou a
// mensagem de seguranca, letra por letra. Fora do contrato vira null: a pagina segue sem nome, como numa falha.
function lerNomeConferido(dados, maximo) {
  if (!dados || typeof dados !== "object") return null;
  const assinatura = textoOuNulo(dados.assinatura);
  const marcaDe = function (texto) {
    return texto && assinatura ? { papel: "assistente", texto: texto, assinatura: assinatura } : null;
  };
  if (dados.tipo === "seguranca") {
    const texto = textoOuNulo(dados.texto);
    if (!texto) return null;
    return {
      tipo: "seguranca", risco: true, como_chamar: null, texto: texto, estado: estadoValido(dados.estado),
      linha_apoio: textoOuNulo(dados.linha_apoio), marca: marcaDe(texto)
    };
  }
  if (dados.tipo !== "nome") return null;
  const linha = textoOuNulo(dados.linha_apoio);
  const marca = marcaDe(textoOuNulo(dados.texto_marca));
  const risco = Boolean(linha) || Boolean(marca);
  return {
    tipo: "nome", risco: risco, como_chamar: risco ? null : limparComoChamar(dados.como_chamar, maximo), texto: null,
    estado: "acolhimento", linha_apoio: linha, marca: marca
  };
}

function rotuloCanal(canal) {
  if (!canal.nome) return canal.numero;
  return canal.nome.indexOf(canal.numero) !== -1 ? canal.nome : canal.nome + " " + canal.numero;
}

// O numero vem do servidor; nome, descricao e icone, da tabela da pagina. Numero fora dela: o nome do servidor, so.
function canalDescrito(canal) {
  const numero = String(canal && canal.numero != null ? canal.numero : "").trim();
  if (Object.prototype.hasOwnProperty.call(CANAIS_DESCRITOS, numero)) {
    const descrito = CANAIS_DESCRITOS[numero];
    return { numero: numero, nome: descrito.nome, descricao: descrito.descricao, icone: descrito.icone };
  }
  return { numero: numero, nome: canal ? textoOuNulo(canal.nome) : null, descricao: null, icone: null };
}

// So algarismos (e o + inicial) entram na ligacao tel:.
function telefoneDoCanal(numero) {
  const texto = String(numero == null ? "" : numero).trim();
  if (!/^\+?[\d ()-]{3,20}$/.test(texto)) return "";
  return (texto.charAt(0) === "+" ? "+" : "") + texto.replace(/\D/g, "");
}

// Ligacoes de CONFIG: so https, mailto, tel ou caminho do proprio site.
function enderecoSeguro(endereco) {
  const texto = String(endereco == null ? "" : endereco).trim();
  if (/^(?:https:\/\/|mailto:|tel:)[^\s]+$/i.test(texto)) return texto;
  if (/^(?:\.\.?\/|#)[^\s]*$/.test(texto) || /^\/(?!\/)[^\s]*$/.test(texto)) return texto;
  return null;
}

// Devolve "vazia", "grande" ou null quando a mensagem pode seguir.
function validarMensagem(texto, maximo) {
  const mensagem = String(texto == null ? "" : texto).trim();
  if (mensagem === "") return "vazia";
  if (mensagem.length > maximo) return "grande";
  return null;
}

function tamanhoEmBytes(texto) {
  let total = 0;
  for (let i = 0; i < texto.length; i++) {
    const codigo = texto.charCodeAt(i);
    if (codigo < 0x80) total += 1;
    else if (codigo < 0x800) total += 2;
    else if (codigo >= 0xD800 && codigo <= 0xDBFF && i + 1 < texto.length) { total += 4; i += 1; }
    else total += 3;
  }
  return total;
}

// Mesma janela do Worker: os turnos mais recentes, ate o maximo de turnos e de caracteres,
// comecando por fala da pessoa. Assinatura so nas falas da assistente.
function prepararHistorico(turnos, maxTurnos, maxCaracteres) {
  const aceitos = [];
  let caracteres = 0;
  for (let i = turnos.length - 1; i >= 0 && aceitos.length < maxTurnos; i--) {
    const turno = turnos[i];
    if (caracteres + turno.texto.length > maxCaracteres) break;
    caracteres += turno.texto.length;
    aceitos.unshift({
      papel: turno.papel,
      texto: turno.texto,
      assinatura: turno.papel === "assistente" ? turno.assinatura : null
    });
  }
  while (aceitos.length > 0 && aceitos[0].papel === "assistente") aceitos.shift();
  return aceitos;
}

// O contexto da acolhida, quando entregue, segue no corpo e conta no teto de bytes.
// marca (opcional): a fala assinada com a marca de risco que a rota do nome devolveu. Vai sempre como primeiro item
// do historico, na frente da janela dos ultimos turnos e fora da conta dela; o Worker a le, ve que ja houve sinal de
// risco na sessao e a tira antes do modelo (a janela dele comeca por fala da pessoa). Conta no teto de bytes.
function montarCorpoChat(mensagem, turnos, limites, contexto, marca) {
  function corpoCom(historico) {
    const corpo = { mensagem: mensagem, historico: marca ? [marca].concat(historico) : historico };
    if (contexto !== undefined) corpo.contexto = contexto;
    return corpo;
  }
  let historico = prepararHistorico(turnos, limites.max_turnos, limites.max_caracteres);
  let corpo = corpoCom(historico);
  while (historico.length > 0 && tamanhoEmBytes(JSON.stringify(corpo)) > limites.max_bytes) {
    historico = historico.slice(1);
    while (historico.length > 0 && historico[0].papel === "assistente") historico = historico.slice(1);
    corpo = corpoCom(historico);
  }
  return corpo;
}

function estadoValido(estado) {
  return ESTADOS_DO_AVATAR.indexOf(estado) !== -1 ? estado : "acolhimento";
}

// Resposta do chat fora do contrato vira null, e a pagina mostra a mensagem fixa de falha.
function lerChat(dados) {
  if (!dados || TIPOS_DE_RESPOSTA.indexOf(dados.tipo) === -1 || !textoOuNulo(dados.texto)) return null;
  let idTurno = null;
  if (typeof dados.id_turno === "number" && isFinite(dados.id_turno)) idTurno = String(dados.id_turno);
  else idTurno = textoOuNulo(dados.id_turno);
  return {
    tipo: dados.tipo,
    texto: dados.texto,
    estado: estadoValido(dados.estado),
    base_ids: (Array.isArray(dados.base_ids) ? dados.base_ids : []).filter(function (id) {
      return typeof id === "string" && id !== "";
    }),
    assinatura: textoOuNulo(dados.assinatura),
    restantes: typeof dados.restantes === "number" && isFinite(dados.restantes) ? dados.restantes : null,
    convite: dados.convite === true,
    linha_apoio: textoOuNulo(dados.linha_apoio),
    id_turno: idTurno,
    saber_mais: lerSaberMais(dados)
  };
}

// "Saber mais": so numa resposta, so textos preenchidos, no maximo tres. Nada de identificador nem titulo.
const MAX_SABER_MAIS = 3;
function lerSaberMais(dados) {
  if (!dados || dados.tipo !== "resposta" || !Array.isArray(dados.saber_mais)) return [];
  const textos = [];
  dados.saber_mais.forEach(function (item) {
    const texto = item && typeof item.texto === "string" ? item.texto.trim() : "";

function sinalDeRisco(chat) {
  return chat.tipo === "seguranca" || Boolean(chat.linha_apoio);
}

// resposta permitida (restantes 0) ou na mensagem de limite. Nunca com risco em algum ponto da sessao.
function podeConvidar(chat, houveRisco) {
  const acabou = chat.tipo === "limite" || chat.restantes === 0;
  return chat.convite === true && acabou && !sinalDeRisco(chat) && houveRisco !== true;
}

// Reenvio da mesma pergunta depois de uma falha: a fala que ficou sem resposta nao segue duas vezes.
function semFalaRepetida(turnos, mensagem) {
  const ultimo = turnos.length > 0 ? turnos[turnos.length - 1] : null;
  return ultimo && ultimo.papel === "pessoa" && ultimo.texto === mensagem ? turnos.slice(0, -1) : turnos;
}

function avisoDeLimite(textos, n) {
  return n === 1 ? textos.aviso_limite_um : preencher(textos.aviso_limite, { n: n });

// Contagem de usos de um convite com limite ({usados, limite, restantes}, de /api/sessao). Sem limite, ou com
// numeros que nao fecham, nao ha contagem: a pagina nao mostra numero errado.
function lerUsosDoConvite(dados) {
  if (!dados || typeof dados !== "object") return null;
  const inteiro = function (valor) {
    return typeof valor === "number" && isFinite(valor) && Math.floor(valor) === valor ? valor : null;
  };
  const usados = inteiro(dados.usados);
  const limite = inteiro(dados.limite);
  if (usados === null || limite === null || limite < 1 || usados < 1 || usados > limite) return null;
  return { usados: usados, limite: limite, restantes: limite - usados };
}

function textoDosUsos(textos, usos) {
  if (!usos) return "";
  const valores = { n: usos.usados, max: usos.limite, r: usos.restantes };
  if (usos.restantes === 0) return preencher(textos.usos_convite_ultimo, valores);
  return preencher(usos.restantes === 1 ? textos.usos_convite_um : textos.usos_convite, valores);
}

// Sessao recusada: a frase do Worker e, com o convite esgotado, o que a pessoa pode fazer.
function mensagemDaRecusa(textos, resposta, padrao) {
  const mensagem = resposta && resposta.mensagem ? resposta.mensagem : null;
  if (resposta && resposta.erro === "convite_esgotado") {
    return (mensagem ? mensagem + " " : "") + textos.convite_esgotado_dica;
  }
  return mensagem || padrao;

// A voz diz o nome como ele se fala: cada grafia de IDENTIDADE.pronuncias vira a forma falada. So na fala; a tela nao muda.
function textoFalado(texto) {
  let falado = String(texto);
  IDENTIDADE.pronuncias.forEach(function (par) { falado = falado.split(par[0]).join(par[1]); });
  return falado;
}

function semAcentos(texto) {
  const separado = typeof texto.normalize === "function" ? texto.normalize("NFD") : texto;
  return separado.replace(/[̀-ͯ]/g, "");
}

// "feminina", "masculina" ou "indefinida", pelo nome da voz: nome proprio da lista como palavra inteira,
// ou as palavras female, male, feminin(a/o) e masculin(a/o). Sinal feminino vence.
function classificarVoz(voz) {
  const nome = semAcentos(String(voz && voz.name != null ? voz.name : "").toLowerCase());
  const palavras = nome.split(/[^a-z0-9]+/).filter(function (palavra) { return palavra !== ""; });
  const temPalavra = function (lista) {
    return palavras.some(function (palavra) { return lista.indexOf(palavra) !== -1; });
  };
  const temMarca = function (expressao) {
    return palavras.some(function (palavra) { return expressao.test(palavra); });
  };
  if (nome.indexOf(VOZES.feminina_pelo_nome) !== -1 || temPalavra(VOZES.femininas) || temMarca(/^(?:female\d*|feminin\w*)$/)) return "feminina";
  if (temPalavra(VOZES.masculinas) || temMarca(/^(?:male\d*|masculin\w*)$/)) return "masculina";
  return "indefinida";
}

// Voz pt-BR, feminina de preferencia, na ordem de ORDEM_DAS_VOZES; na mesma classe, a primeira da lista do navegador.
function vozPtBr(vozes) {
  const lista = Array.prototype.slice.call(vozes || []).filter(function (voz) {
    return Boolean(voz) && /^pt[-_]br$/i.test(String(voz.lang));
  });
  for (let i = 0; i < ORDEM_DAS_VOZES.length; i++) {
    for (let j = 0; j < lista.length; j++) {
      const local = lista[j].localService === true;
      if (classificarVoz(lista[j]) === ORDEM_DAS_VOZES[i][0] && local === ORDEM_DAS_VOZES[i][1]) return lista[j];
    }
  }
  return null;
}

function limparNome(texto, maximo) {
  const limpo = String(texto == null ? "" : texto)
    .replace(/[\u0000-\u001F\u007F-\u009F]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
  let saida = "";
  // Percorre por caractere inteiro, para nao cortar um emoji ao meio.
  for (const letra of limpo) {
    if (saida.length + letra.length > maximo) break;
    saida += letra;
  }
  return saida.trim();
}

// Mesma regra do Worker (normalizarEmail, em validacao.mjs): endereco que a pagina aceita, o Worker tambem aceita.
const EMAIL_PARTE_LOCAL = /^[a-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-z0-9!#$%&'*+/=?^_`{|}~-]+)*$/;
const EMAIL_ROTULO = /^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/;
const EMAIL_TERMINACAO = /^[a-z]{2,24}$/;

function emailValido(texto, maximo) {
  const email = String(texto == null ? "" : texto).trim().toLowerCase();
  if (email.length === 0 || email.length > (maximo || 254)) return false;
  const arroba = email.indexOf("@");
  if (arroba < 1 || arroba !== email.lastIndexOf("@")) return false;
  const local = email.slice(0, arroba);
  const rotulos = email.slice(arroba + 1).split(".");
  return local.length <= 64 && EMAIL_PARTE_LOCAL.test(local) && rotulos.length >= 2 &&
    rotulos.every(function (rotulo) { return EMAIL_ROTULO.test(rotulo); }) &&
    EMAIL_TERMINACAO.test(rotulos[rotulos.length - 1]);
}

// Devolve a chave do erro em TEXTOS.contato.erros, ou null quando pode enviar.
function validarContato(campos, limites) {
  if (limparNome(campos.nome, limites.nome_max) === "") return "falta_nome";
  const email = String(campos.email == null ? "" : campos.email).trim();
  if (email === "") return "falta_email";
  if (!emailValido(email, limites.email_max)) return "email_invalido";
  if (campos.contato !== true) return "falta_contato";
  if (campos.maior_de_18 !== true) return "falta_maior";
  return null;
}

// So o que a pessoa digitou no formulario: nada da sessao nem da conversa entra aqui.
function montarContato(dados) {
  return {
    nome: limparNome(dados.nome, dados.nome_max),
    email: String(dados.email).trim(),
    origem: "assistente",
    plano_interesse: null,
    aceites: {
      contato: dados.contato === true,
      maior_de_18: dados.maior_de_18 === true,
      versao_textos: dados.versao_textos

    turnstile: String(dados.turnstile)

}

function planoValido(plano, planos) {
  return planos.some(function (opcao) { return opcao.valor === plano; });
}

// Devolve a chave do erro, ou null quando pode enviar. O nome e opcional.
function validarPreInscricao(campos, limites) {
  const email = String(campos.email == null ? "" : campos.email).trim();
  if (email === "") return "falta_email";
  if (!emailValido(email, limites.email_max)) return "email_invalido";
  if (!planoValido(campos.plano, limites.planos)) return "falta_plano";
  if (campos.aviso !== true) return "falta_aviso";
  if (campos.maior_de_18 !== true) return "falta_maior";
  return null;
}

// So o que a pessoa preencheu neste formulario: nada da sessao nem da conversa entra aqui.
// No contrato de /api/contatos, o aceite de ser avisada vai no campo "contato".
function montarPreInscricao(dados) {
  const nome = limparNome(dados.nome, dados.nome_max);
  return {
    nome: nome === "" ? null : nome,
    email: String(dados.email).trim(),
    origem: "pre_inscricao",
    plano_interesse: dados.plano,
    aceites: {
      contato: dados.aviso === true,
      maior_de_18: dados.maior_de_18 === true,
      versao_textos: dados.versao_textos
    },
    turnstile: String(dados.turnstile)
  };
}

function motivoValido(motivo, motivos) {
  return motivos.some(function (opcao) { return opcao.valor === motivo; });
}

function montarFeedback(dados) {
  return {
    id_turno: dados.id_turno,

  };

// proprio <html> pelo gerador (ferramentas/gerar-paginas.mjs): sem atributo e a de hoje; data-cara="v1" e a nova. O

(function () {
  "use strict";
  if (typeof document === "undefined" || !document.documentElement || typeof window === "undefined") return;
  var raiz = document.documentElement;
  var busca = "";
  try {
    busca = String((window.location && window.location.search) || "");
  } catch (erro) {
    busca = "";
  }
  var pedido = /(?:^\?|&)cara=(v1|atual)(?:&|$)/.exec(busca);
  if (!pedido || pedido[1] === (raiz.getAttribute("data-cara") || "atual")) return;

  raiz.setAttribute("data-cara", escolha);
  // Leva a escolha para os links do proprio site (caminho relativo), na hora do toque: vale tambem para os links
  // que o script cria depois. Link de fora, de telefone, de e-mail ou da mesma pagina (#) fica como esta.
  document.addEventListener("click", function (evento) {
    var alvo = evento.target;
    while (alvo && alvo.nodeType === 1 && String(alvo.nodeName).toLowerCase() !== "a") alvo = alvo.parentNode;
    if (!alvo || alvo.nodeType !== 1 || !alvo.getAttribute) return;

})();
