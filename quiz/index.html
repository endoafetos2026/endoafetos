function embaralhar(lista, aleatorio) {
  const sorteio = typeof aleatorio === "function" ? aleatorio : Math.random;
  const copia = lista.slice();
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(sorteio() * (i + 1));
    const troca = copia[i];
    copia[i] = copia[j];
    copia[j] = troca;
  }
  return copia;
}

function prepararPartida(perguntas, aleatorio) {
  return perguntas.map(function (pergunta) {
    return {
      id: pergunta.id,
      enunciado: pergunta.enunciado,
      alternativas: embaralhar(pergunta.alternativas, aleatorio).map(function (alternativa) {
        return { texto: alternativa.texto, correta: alternativa.correta === true };
      }),
      explicacao: pergunta.explicacao,
      base_ids: pergunta.base_ids.slice()
    };
  });
}

function contarAcertos(respostas) {
  return respostas.filter(function (resposta) {
    return Boolean(resposta) && resposta.acertou === true;
  }).length;
}

function limparNome(texto, maximo) {
  const limpo = String(texto == null ? "" : texto)
    .replace(/[\u0000-\u001F\u007F-\u009F]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
  let saida = "";
  // Percorre por caractere inteiro, para nao cortar um emoji ao meio.
  for (const letra of limpo) {
    if (saida.length + letra.length > maximo) break;
    saida += letra;
  }
  return saida.trim();
}

// Uma passada so: o que entra no lugar de {chave} nao e lido de novo.
function preencher(modelo, valores) {
  return String(modelo).replace(/\{(\w+)\}/g, function (trecho, chave) {
    return Object.prototype.hasOwnProperty.call(valores, chave) ? String(valores[chave]) : trecho;
  });
}

function rotuloCanal(canal) {
  if (!canal.nome) return canal.numero;
  return canal.nome.indexOf(canal.numero) !== -1 ? canal.nome : canal.nome + " " + canal.numero;
}

function emailValido(texto, maximo) {
  const email = String(texto == null ? "" : texto).trim();
  return email.length > 0 && email.length <= (maximo || 254) && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

}

function enderecoEnvio(config) {
  return String(config.api).replace(/\/+$/, "") + "/api/quiz";
}

// Devolve a chave do erro em TEXTOS.coleta.erros, ou null quando pode enviar.
function validarColeta(campos, maximoEmail) {
  const email = String(campos.email == null ? "" : campos.email).trim();
  if (email === "") return "falta_email";
  if (!emailValido(email, maximoEmail)) return "email_invalido";
  if (campos.resultado !== true && campos.convite !== true) return "falta_aceite";
  if (campos.maior_de_18 !== true) return "falta_maior";
  return null;
}

// UUID versao 4 a partir de 16 bytes aleatorios, para navegador sem crypto.randomUUID.
function uuidDeBytes(bytes) {
  const b = Array.prototype.slice.call(bytes, 0, 16);
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const hex = b.map(function (n) { return (n + 256).toString(16).slice(1); }).join("");
  return [hex.slice(0, 8), hex.slice(8, 12), hex.slice(12, 16), hex.slice(16, 20), hex.slice(20)].join("-");
}

// Dentro da guarda, o toque ainda pode ser o segundo de um toque duplo na tela anterior.
function dentroDaGuarda(agora, mudouEm, guarda) {
  const passou = agora - mudouEm;
  return passou >= 0 && passou < guarda;
}

function montarEnvio(dados) {
  return {
    id_envio: String(dados.id_envio),
    nome: limparNome(dados.nome, dados.nome_max),
    email: String(dados.email).trim(),
    acertos: dados.acertos,
    versao_quiz: dados.versao_quiz,
    aceites: {
      resultado: dados.resultado === true,
      convite: dados.convite === true,
      maior_de_18: dados.maior_de_18 === true,
      versao_textos: dados.versao_textos
    },
    turnstile: String(dados.turnstile)
  };
}

    return new Promise(function (resolver, rejeitar) {
      const prazo = setTimeout(function () { rejeitar(new Error("prazo")); }, milissegundos);
      promessa.then(
        function (valor) { clearTimeout(prazo); resolver(valor); },
        function (falha) { clearTimeout(prazo); rejeitar(falha); }
      );
    });
  }

  function carregarTurnstile() {
    if (window.turnstile) return Promise.resolve();
    if (!cargaTurnstile) {
      cargaTurnstile = new Promise(function (resolver, rejeitar) {
        const script = document.createElement("script");
        script.src = CONFIG.turnstile_script;
        script.async = true;
        script.onload = function () { resolver(); };
        script.onerror = function () {
          cargaTurnstile = null;
          if (script.parentNode) script.parentNode.removeChild(script);
          rejeitar(new Error("turnstile"));
        };
        document.head.appendChild(script);
      });
    }
    return cargaTurnstile;
  }

  function criarDesafio(caixa) {
    const desafio = { id: null, ficha: "", usada: false, falhou: false, espera: null, desistir: null };

    desafio.preparar = function () {
      // O prazo vale para esta espera; o pedido do script segue e a proxima tentativa o aproveita.
      return comPrazo(carregarTurnstile(), CONFIG.espera_script_ms).then(function () {
        if (desafio.id !== null) return;
        desafio.id = window.turnstile.render(caixa, {
          sitekey: CONFIG.turnstile_sitekey,
          size: caixa.clientWidth < 300 ? "compact" : "flexible",
          language: "pt-br",
          callback: function (ficha) {
            desafio.ficha = ficha;
            desafio.usada = false;
            desafio.falhou = false;
            if (desafio.espera) desafio.espera();
          },
          "expired-callback": function () { desafio.ficha = ""; },
          // Erro do Turnstile encerra a espera na hora, sem aguardar o prazo inteiro.
          "error-callback": function () {
            desafio.ficha = "";
            desafio.falhou = true;
            if (desafio.desistir) desafio.desistir();
            return true;
          }
        });
      });
    };

    // A ficha do Turnstile vale uma vez: cada tentativa pede uma nova.
    desafio.pedirFicha = function () {
      return desafio.preparar().then(function () {
        function entregar() {
          const ficha = desafio.ficha;
          desafio.ficha = "";
          desafio.usada = true;
          return ficha;
        }
        if (desafio.ficha) return entregar();
        return new Promise(function (resolver, rejeitar) {
          function encerrar() {
            clearTimeout(prazo);
            desafio.espera = null;
            desafio.desistir = null;
          }
          const prazo = setTimeout(function () {
            encerrar();
            rejeitar(new Error("turnstile"));
          }, CONFIG.espera_turnstile_ms);
          desafio.espera = function () {
            encerrar();
            resolver(entregar());
          };
          desafio.desistir = function () {
            encerrar();
            rejeitar(new Error("turnstile"));
          };
          // Ficha ja usada ou erro anterior: pede um desafio novo.
          if (desafio.usada || desafio.falhou) {
            desafio.usada = false;
            desafio.falhou = false;
            window.turnstile.reset(desafio.id);
          }
        });
      });
    };

    desafio.remover = function () {
      desafio.espera = null;
      desafio.desistir = null;
      if (desafio.id !== null && window.turnstile) {
        try { window.turnstile.remove(desafio.id); } catch (falha) { /* sem efeito */ }
      }
    };

    return desafio;
  }

  function postar(corpo, envio) {
    const controle = typeof AbortController === "function" ? new AbortController() : null;
    envio.controle = controle;
    const prazo = controle
      ? setTimeout(function () { controle.abort(); }, CONFIG.espera_resposta_ms)
      : null;
    return window.fetch(enderecoEnvio(CONFIG), {
      method: "POST",
      mode: "cors",
      credentials: "omit",
      cache: "no-store",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(corpo),
      signal: controle ? controle.signal : undefined
    }).then(
      function (resposta) { return resposta.ok === true; },
      function () { return false; }
    ).then(function (deuCerto) {
      if (prazo) clearTimeout(prazo);
      envio.controle = null;
      return deuCerto;
    });
  }

  function caixaDeMarcar(identificador, texto) {

  function blocoColeta(acertos) {
    const textos = TEXTOS.coleta;
    // O id nasce no primeiro envio e muda quando os dados mudam (ver enviar).
    const envio = { id: null, dados: null, situacao: "parado", controle: null, ativo: true };

    const secao = no("section", "coleta");
    secao.setAttribute("aria-labelledby", "titulo-coleta");
    const titulo = no("h2", null, textos.titulo);

    const formulario = no("form");

    email.type = "email";
    email.id = "campo-email";
    email.maxLength = CONFIG.email_max;
    email.setAttribute("inputmode", "email");

    email.setAttribute("spellcheck", "false");

    campo.appendChild(rotuloEmail);

    const querConvite = caixaDeMarcar("caixa-convite", textos.caixa_convite);
    const maior = caixaDeMarcar("caixa-maior", textos.caixa_maior);
    const oQueSegue = no("p", "dica", textos.o_que_segue);

    const controles = [email, querResultado.entrada, querConvite.entrada, maior.entrada];

            acertos: acertos,
            versao_quiz: VERSAO_QUIZ,
            resultado: campos.resultado,
            convite: campos.convite,
            maior_de_18: campos.maior_de_18,
            versao_textos: TEXTOS.versao,
            turnstile: ficha
          }), envio);
        } catch (falha) {
          deuCerto = false;
        }
        if (!envio.ativo) return;
        if (!deuCerto && tentativa < CONFIG.tentativas_envio) {
          await esperar(CONFIG.espera_entre_tentativas_ms * tentativa);
          if (!envio.ativo) return;
        }
      }

      if (deuCerto) {
        envio.situacao = "enviado";
        desafio.remover();
        esvaziar(secao);
        const sucesso = no("p", "coleta__status", textos.sucesso);
        sucesso.tabIndex = -1;
        secao.appendChild(sucesso);
        sucesso.focus();
      } else {
        envio.situacao = "falhou";
        travar(false);
        botao.textContent = textos.tentar;
        status.textContent = textos.falha;
      }
    }

    // O script do Turnstile so e pedido quando a pessoa entra no formulario.
    formulario.addEventListener("focusin", function () {
      desafio.preparar().catch(function () { /* o envio tenta de novo */ });
    }, { once: true });
    formulario.addEventListener("submit", function (evento) {
      evento.preventDefault();
      enviar();
    });

    return {
      secao: secao,
      encerrar: function () {
        envio.ativo = false;
        if (envio.controle) envio.controle.abort();
        desafio.remover();
      }
    };
  }

  telaInicial(false);
})();
/* ==== PAGINA:FIM ==== */
</script>
</body>
</html>
